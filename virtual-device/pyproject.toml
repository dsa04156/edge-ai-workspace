[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-virtual-device-runtime"
version = "0.1.0"
description = "Profile-driven Serial JSON Virtual Device Runtime prototype"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "paho-mqtt>=2.0,<3",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["virtual_device*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
