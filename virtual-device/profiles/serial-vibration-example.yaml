virtualDeviceId: etri-vd0001-vibration
physicalDeviceId: etri-pd0001-arduino
nodeId: etri-dev0001-jetorn
capability: vibration

adapter:
  type: serial-json
  connection:
    port: /dev/ttyACM0
    baudRate: 115200
    timeoutSeconds: 2

mapping:
  sensorField: sensor
  deviceIdField: device_id
  timestampFields:
    - source_ts
    - ts
    - timestamp
  properties:
    x:
      target: acceleration_x
      type: float
      unit: g
    y:
      target: acceleration_y
      type: float
      unit: g
    z:
      target: acceleration_z
      type: float
      unit: g

output:
  mqtt:
    host: 127.0.0.1
    port: 1883
    qos: 0
    telemetryTopic: edge/virtual-devices/etri-vd0001-vibration/telemetry
    statusTopic: edge/virtual-devices/etri-vd0001-vibration/status

runtime:
  heartbeatSeconds: 10
  offlineAfterSeconds: 30
  reconnectBackoffSeconds: 1
  reconnectBackoffMaxSeconds: 30
