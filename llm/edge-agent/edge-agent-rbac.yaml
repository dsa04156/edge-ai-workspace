apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-agent
  labels:
    app: edge-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-agent-readonly
  labels:
    app: edge-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["devices.kubeedge.io"]
    resources: ["devices", "devicemodels"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-agent-readonly
  labels:
    app: edge-agent
subjects:
  - kind: ServiceAccount
    name: edge-agent
    namespace: default
roleRef:
  kind: ClusterRole
  name: edge-agent-readonly
  apiGroup: rbac.authorization.k8s.io
