apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-agent
  labels:
    app: edge-agent
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: edge-agent
  template:
    metadata:
      labels:
        app: edge-agent
    spec:
      serviceAccountName: edge-agent
      nodeSelector:
        agent-node: "true"
      containers:
        - name: edge-agent
          image: 192.168.0.56:5000/edge-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONIOENCODING
              value: utf-8
            - name: OPENAI_BASE_URL
              value: http://ollama-qwen3.default.svc.cluster.local:11434/v1
            - name: OPENAI_API_KEY
              value: ollama
            - name: OPENAI_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: llm-model-config
                  key: MODEL_ID
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.kube-system.svc:9090
---
apiVersion: v1
kind: Service
metadata:
  name: edge-agent-svc
  labels:
    app: edge-agent
spec:
  type: NodePort
  selector:
    app: edge-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 32156
