apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-orch-sensor-anomaly-demo
  namespace: argocd
  annotations:
    edge-ai.io/lifecycle: retired
    edge-ai.io/retired-at: "2026-09-30"
spec:
  project: default
  source:
    repoURL: https://github.com/dsa04156/edge-ai-workspace.git
    path: edge-orch/sensor-anomaly-demo/k8s
    targetRevision: agent/edgex-central-docs
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: edgex-edge
  ignoreDifferences:
    - group: coordination.k8s.io
      kind: Lease
      name: sensor-anomaly-demo-execution
      namespace: edgex-edge
      jsonPointers:
        - /spec
  syncPolicy:
    # Retired demo: retained for explicit recovery, not automatic deployment.
    syncOptions:
      - RespectIgnoreDifferences=true
