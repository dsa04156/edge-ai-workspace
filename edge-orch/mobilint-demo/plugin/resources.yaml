apiVersion: v1
kind: ServiceAccount
metadata:
  name: mobilint-device-plugin
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mobilint-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mobilint-device-plugin
      app.kubernetes.io/instance: mobilint-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mobilint-device-plugin
        app.kubernetes.io/instance: mobilint-device-plugin
    spec:
      serviceAccountName: mobilint-device-plugin
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      nodeSelector:
        mobilint.com/npu.present: 'true'
        kubernetes.io/hostname: etri-ser0004-cgnms0
      containers:
      - name: mobilint-device-plugin
        image: ghcr.io/mobilint/mobilint-device-plugin:v1.1.1@sha256:4da52f77ba9f2f6607c5639053fa8d292c42872fb82d32b4f2389a551d11844c
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        ports:
        - name: metrics
          containerPort: 9400
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 5
          failureThreshold: 1
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: cdi
          mountPath: /var/run/cdi
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
      - name: cdi
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      automountServiceAccountToken: false
