apiVersion: platform.jinuk.io/v1alpha1
kind: RuntimeService
metadata:
  name: llama-inference
  namespace: platform-runtime
spec:
  execution: http-json-v1
  ioContract: llama.qualified-eight-token.v1
  port: 18110
  timeoutSeconds: 30
  inference:
    modelDigest: baf6a787fdffd633537aa2eb51cfd54cb93ff08e28040095462bb63daf552878
    prompt: In one short sentence, explain why edge computing reduces latency.
    maxTokens: 8
  variants:
  - name: resident-llama-agx
    image: localhost/qualification/ollama-jetson@sha256:b1e591bcd625f3ecb0abdad843ad369a637e6f99f7543dd0d7581c20aee40a28
    architecture: arm64
    backend: cuda
    runtimeClassName: null
    requests:
      cpu: 250m
      memory: 256Mi
      nvidia.com/gpu.shared: '1'
    limits:
      cpu: '6'
      memory: 8Gi
      nvidia.com/gpu.shared: '1'
    maxInFlight: 1
    qualifiedRps: 4.8
    qualification: nano-agx-continuity/v2:policy:c1368446293834f1e5bdfe1f7c0e085673e0004a2c27978be96e32be86c740b3
    resident:
      protocol: llama-worker-v1
      namespace: llama-continuity-test
      service: llama-agx
      selector:
        app: llama-agx
      container: inference-runtime
      previousControllers:
      - namespace: llama-continuity-test
        name: ordered-offload-controller
      - namespace: llama-continuity-test
        name: continuity-controller
  - name: resident-llama-spark
    image: docker.io/ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    architecture: arm64
    backend: cuda
    runtimeClassName: nvidia-spark
    requests:
      cpu: 250m
      memory: 256Mi
      nvidia.com/gpu: '1'
    limits:
      cpu: '6'
      memory: 8Gi
      nvidia.com/gpu: '1'
    maxInFlight: 1
    qualifiedRps: 6
    qualification: ordered-demo-spark-profile/v1:sha256:4d9e86b60cf333edfe6a4ed3c09d88ce3f1721e5a7b738d8d09d9732cc731545
    resident:
      protocol: llama-worker-v1
      namespace: llama-continuity-test
      service: llama-spark
      selector:
        app: llama-spark
      container: inference-runtime
      previousControllers:
      - namespace: llama-continuity-test
        name: ordered-offload-controller
      - namespace: llama-continuity-test
        name: continuity-controller
  policy:
    mode: automatic
    preferredRole: edge
    allowedRoles:
    - edge
    - server
    pressureSeconds: 4
    returnSeconds: 8
    cooldownSeconds: 5
    prepareTimeoutSeconds: 90
