apiVersion: platform.jinuk.io/v1alpha1
kind: RuntimeService
metadata:
  name: llama-inference
  namespace: platform-runtime
spec:
  execution: http-json-v1
  ioContract: llama.qualified-eight-token.v1
  port: 18110
  timeoutSeconds: 30
  inference:
    modelDigest: baf6a787fdffd633537aa2eb51cfd54cb93ff08e28040095462bb63daf552878
    prompt: In one short sentence, explain why edge computing reduces latency.
    maxTokens: 8
  variants:
  - name: resident-llama-agx
    image: localhost/qualification/ollama-jetson@sha256:b1e591bcd625f3ecb0abdad843ad369a637e6f99f7543dd0d7581c20aee40a28
    architecture: arm64
    backend: cuda
    runtimeClassName: null
    requests:
      cpu: 250m
      memory: 256Mi
      nvidia.com/gpu.shared: '1'
    limits:
      cpu: '6'
      memory: 8Gi
      nvidia.com/gpu.shared: '1'
    maxInFlight: 1
    qualifiedRps: 4.8
    qualification: '8-token Llama: RPS qualification plus results/2026-09-10-latency/edge-qualification.json'
    resident:
      protocol: llama-worker-v1
      namespace: llama-continuity-test
      service: llama-agx
      selector:
        app: llama-agx
      container: inference-runtime
      previousControllers:
      - namespace: llama-continuity-test
        name: ordered-offload-controller
      - namespace: llama-continuity-test
        name: continuity-controller
    qualifiedP95Milliseconds: 531.578
  - name: resident-llama-spark
    image: docker.io/ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    architecture: arm64
    backend: cuda
    runtimeClassName: nvidia-spark
    requests:
      cpu: 250m
      memory: 256Mi
      nvidia.com/gpu: '1'
    limits:
      cpu: '6'
      memory: 8Gi
      nvidia.com/gpu: '1'
    maxInFlight: 1
    qualifiedRps: 6
    qualification: '8-token Llama: RPS qualification plus results/2026-09-10-latency/server-qualification.json'
    resident:
      protocol: llama-worker-v1
      namespace: llama-continuity-test
      service: llama-spark
      selector:
        app: llama-spark
      container: inference-runtime
      previousControllers:
      - namespace: llama-continuity-test
        name: ordered-offload-controller
      - namespace: llama-continuity-test
        name: continuity-controller
    qualifiedP95Milliseconds: 456.092
  policy:
    mode: automatic
    approvalRequired: true
    preferredRole: edge
    allowedRoles:
    - edge
    - server
    pressureSeconds: 4
    returnSeconds: 8
    cooldownSeconds: 5
    prepareTimeoutSeconds: 90
    latency:
      maxP95Milliseconds: 900
      returnP95Milliseconds: 700
      windowSeconds: 20
      minSamples: 10
      breachSeconds: 4
  demo:
    label: 실제 GPU Llama · 검증된 8-token 입력
    payload:
      prompt: In one short sentence, explain why edge computing reduces latency.
      max_tokens: 8
    maxRequests: 512
    concurrency: 6
    pressureSeconds: 40
    recoverySeconds: 120
    recoveryIntervalSeconds: 1
