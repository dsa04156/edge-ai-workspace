apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runtimeservices.platform.jinuk.io
spec:
  group: platform.jinuk.io
  scope: Namespaced
  names:
    plural: runtimeservices
    singular: runtimeservice
    kind: RuntimeService
    shortNames:
    - rtsvc
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Node
      type: string
      jsonPath: .status.active.node
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              execution:
                default: http-json-v1
                type: string
                enum:
                - http-json-v1
              ioContract:
                maxLength: 128
                minLength: 1
                type: string
              port:
                default: 8080
                maximum: 65535
                minimum: 1024
                type: integer
              readyPath:
                default: /ready
                type: string
              requestPath:
                default: /infer
                type: string
              timeoutSeconds:
                default: 30
                maximum: 300
                minimum: 1
                type: number
              maxBodyBytes:
                default: 65536
                maximum: 1048576
                minimum: 1
                type: integer
              variants:
                items:
                  properties:
                    name:
                      pattern: ^[a-z][a-z0-9-]{0,30}$
                      type: string
                    image:
                      pattern: ^[^\s]+@sha256:[0-9a-f]{64}$
                      type: string
                    architecture:
                      enum:
                      - arm64
                      - amd64
                      type: string
                    backend:
                      maxLength: 64
                      minLength: 1
                      type: string
                    nodeSelector:
                      additionalProperties:
                        type: string
                      type: object
                    runtimeClassName:
                      default: null
                      type: string
                      nullable: true
                    requests:
                      additionalProperties:
                        type: string
                      type: object
                    limits:
                      additionalProperties:
                        type: string
                      type: object
                    maxInFlight:
                      maximum: 256
                      minimum: 1
                      type: integer
                    qualification:
                      maxLength: 256
                      minLength: 1
                      type: string
                    resident:
                      properties:
                        protocol:
                          type: string
                          enum:
                          - llama-worker-v1
                        namespace:
                          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                          type: string
                        service:
                          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                          type: string
                        selector:
                          additionalProperties:
                            type: string
                          minProperties: 1
                          type: object
                        container:
                          maxLength: 63
                          minLength: 1
                          type: string
                        previousControllers:
                          items:
                            properties:
                              namespace:
                                pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                                type: string
                              name:
                                pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                                type: string
                            required:
                            - namespace
                            - name
                            type: object
                          maxItems: 8
                          minItems: 1
                          type: array
                      required:
                      - protocol
                      - namespace
                      - service
                      - selector
                      - container
                      - previousControllers
                      type: object
                      default: null
                      nullable: true
                    qualifiedRps:
                      default: null
                      exclusiveMinimum: true
                      maximum: 100000
                      type: number
                      nullable: true
                      minimum: 0
                    qualifiedP95Milliseconds:
                      default: null
                      exclusiveMinimum: true
                      maximum: 300000
                      type: number
                      nullable: true
                      minimum: 0
                  required:
                  - name
                  - image
                  - architecture
                  - backend
                  - requests
                  - limits
                  - maxInFlight
                  - qualification
                  type: object
                maxItems: 32
                minItems: 1
                type: array
              policy:
                properties:
                  mode:
                    default: automatic
                    enum:
                    - automatic
                    - preferred
                    type: string
                  approvalRequired:
                    default: false
                    type: boolean
                  preferredRole:
                    default: edge
                    enum:
                    - edge
                    - server
                    type: string
                  allowedRoles:
                    items:
                      enum:
                      - edge
                      - server
                      type: string
                    minItems: 1
                    type: array
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  highWatermark:
                    default: 0.8
                    exclusiveMinimum: true
                    maximum: 1
                    type: number
                    minimum: 0
                  lowWatermark:
                    default: 0.2
                    exclusiveMaximum: true
                    minimum: 0
                    type: number
                    maximum: 1
                  pressureSeconds:
                    default: 10
                    maximum: 3600
                    minimum: 1
                    type: number
                  returnSeconds:
                    default: 60
                    maximum: 86400
                    minimum: 1
                    type: number
                  cooldownSeconds:
                    default: 30
                    maximum: 86400
                    minimum: 1
                    type: number
                  prepareTimeoutSeconds:
                    default: 180
                    maximum: 1800
                    minimum: 5
                    type: number
                  latency:
                    properties:
                      maxP95Milliseconds:
                        exclusiveMinimum: true
                        maximum: 300000
                        type: number
                        minimum: 0
                      returnP95Milliseconds:
                        exclusiveMinimum: true
                        maximum: 300000
                        type: number
                        minimum: 0
                      windowSeconds:
                        default: 60
                        maximum: 600
                        minimum: 5
                        type: number
                      minSamples:
                        default: 20
                        maximum: 1024
                        minimum: 3
                        type: integer
                      breachSeconds:
                        default: 10
                        maximum: 3600
                        minimum: 1
                        type: number
                    required:
                    - maxP95Milliseconds
                    - returnP95Milliseconds
                    type: object
                    default: null
                    nullable: true
                type: object
              suspended:
                default: false
                type: boolean
              inference:
                properties:
                  modelDigest:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  prompt:
                    maxLength: 4096
                    minLength: 1
                    type: string
                  maxTokens:
                    maximum: 256
                    minimum: 1
                    type: integer
                required:
                - modelDigest
                - prompt
                - maxTokens
                type: object
                default: null
                nullable: true
              demo:
                properties:
                  label:
                    maxLength: 80
                    minLength: 1
                    type: string
                  payload:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  maxRequests:
                    default: 512
                    maximum: 512
                    minimum: 1
                    type: integer
                  concurrency:
                    default: 6
                    maximum: 8
                    minimum: 1
                    type: integer
                  pressureSeconds:
                    default: 25
                    maximum: 40
                    minimum: 1
                    type: number
                  recoverySeconds:
                    default: 120
                    maximum: 120
                    minimum: 1
                    type: number
                  recoveryIntervalSeconds:
                    default: 1
                    maximum: 10
                    minimum: 0.5
                    type: number
                required:
                - label
                - payload
                type: object
                default: null
                nullable: true
            required:
            - ioContract
            - variants
            type: object
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
