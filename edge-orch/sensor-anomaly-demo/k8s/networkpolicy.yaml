apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sensor-anomaly-demo-network
  namespace: edgex-edge
  labels:
    app.kubernetes.io/name: sensor-anomaly-demo
    app.kubernetes.io/part-of: edge-ai-service-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sensor-anomaly-demo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: state-aggregator
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device-serial-jetson
      ports:
        - protocol: TCP
          port: 59910
    # KubeEdge edge Pods cannot route the kubernetes.default Service VIP.
    # Permit only the control-plane API endpoint used for the named Lease;
    # RBAC further limits the workload to get/update on that Lease.
    - to:
        - ipBlock:
            cidr: 192.168.0.56/32
      ports:
        - protocol: TCP
          port: 6443
