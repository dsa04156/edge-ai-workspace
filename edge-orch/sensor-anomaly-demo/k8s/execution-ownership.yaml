apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-anomaly-demo-execution
  namespace: edgex-edge
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-anomaly-demo-execution
  namespace: edge-ai-workloads
automountServiceAccountToken: true
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: sensor-anomaly-demo-execution
  namespace: edgex-edge
  labels:
    edge-ai.io/managed-by: runtime-execution-controller
    edge-ai.io/service-id: sensor-anomaly-demo
spec:
  holderIdentity: sensor-anomaly-demo
  leaseDurationSeconds: 15
  leaseTransitions: 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sensor-anomaly-demo-execution-lease
  namespace: edgex-edge
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["sensor-anomaly-demo-execution"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sensor-anomaly-demo-execution-lease
  namespace: edgex-edge
subjects:
  - kind: ServiceAccount
    name: sensor-anomaly-demo-execution
    namespace: edgex-edge
  - kind: ServiceAccount
    name: sensor-anomaly-demo-execution
    namespace: edge-ai-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sensor-anomaly-demo-execution-lease
