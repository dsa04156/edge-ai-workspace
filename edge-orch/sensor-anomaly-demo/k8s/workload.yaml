apiVersion: v1
kind: Service
metadata:
  name: sensor-anomaly-demo
  namespace: edgex-edge
  labels:
    app.kubernetes.io/name: sensor-anomaly-demo
    app.kubernetes.io/part-of: edge-ai-service-demo
spec:
  selector:
    app.kubernetes.io/name: sensor-anomaly-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-anomaly-demo
  namespace: edgex-edge
  labels:
    app.kubernetes.io/name: sensor-anomaly-demo
    app.kubernetes.io/part-of: edge-ai-service-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor-anomaly-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor-anomaly-demo
        app.kubernetes.io/part-of: edge-ai-service-demo
        edge-ai.io/local-data-client: "true"
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-dev0001-jetorn
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sensor-anomaly-demo
          image: 192.168.0.56:5000/sensor-anomaly-demo@sha256:1b020fe8acd3562ba5fe2d5f59efa52159aea593a60dcefd8d20da159a762a43
          imagePullPolicy: IfNotPresent
          env:
            - name: LOCAL_DATA_BASE_URL
              value: http://device-serial-jetson.edgex-edge.svc.cluster.local:59910
            - name: POLL_INTERVAL_SECONDS
              value: "0.5"
            - name: INPUT_STALE_SECONDS
              value: "10"
            - name: HTTP_TIMEOUT_SECONDS
              value: "2"
            - name: WARMUP_SAMPLES
              value: "30"
            - name: ANOMALY_THRESHOLD
              value: "4"
            - name: STDDEV_FLOOR
              value: "1"
            - name: ANOMALY_STREAK
              value: "2"
            - name: CLEAR_STREAK
              value: "3"
            - name: EWMA_ALPHA
              value: "0.05"
            - name: RECENT_RESULT_LIMIT
              value: "1000"
            - name: PENDING_TTL_SECONDS
              value: "10"
            - name: MAX_PENDING_FRAMES
              value: "1000"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
