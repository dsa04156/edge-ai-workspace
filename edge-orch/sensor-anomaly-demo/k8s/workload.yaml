apiVersion: v1
kind: Service
metadata:
  name: sensor-anomaly-demo
  namespace: edgex-edge
  labels:
    app.kubernetes.io/name: sensor-anomaly-demo
    app.kubernetes.io/part-of: edge-ai-service-demo
spec:
  selector:
    app.kubernetes.io/name: sensor-anomaly-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-anomaly-demo
  namespace: edgex-edge
  labels:
    app.kubernetes.io/name: sensor-anomaly-demo
    app.kubernetes.io/part-of: edge-ai-service-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor-anomaly-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor-anomaly-demo
        app.kubernetes.io/part-of: edge-ai-service-demo
        edge-ai.io/local-data-client: "true"
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-dev0001-jetorn
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sensor-anomaly-demo
          image: 192.168.0.56:5000/sensor-anomaly-demo@sha256:6f342bdf80ba74f1d8f75af492001a1145feadda107a62b6e44461e6288e4a8a
          imagePullPolicy: IfNotPresent
          env:
            - name: REMOTE_INFERENCE_MODE
              value: disabled
            - name: LOCAL_DATA_BASE_URL
              value: http://device-serial-jetson.edgex-edge.svc.cluster.local:59910
            - name: POLL_INTERVAL_SECONDS
              value: "0.5"
            - name: INPUT_STALE_SECONDS
              value: "10"
            - name: HTTP_TIMEOUT_SECONDS
              value: "2"
            - name: WARMUP_SAMPLES
              value: "30"
            - name: ANOMALY_THRESHOLD
              value: "4"
            - name: STDDEV_FLOOR
              value: "1"
            - name: ANOMALY_STREAK
              value: "2"
            - name: CLEAR_STREAK
              value: "3"
            - name: EWMA_ALPHA
              value: "0.05"
            - name: RECENT_RESULT_LIMIT
              value: "1000"
            - name: PENDING_TTL_SECONDS
              value: "10"
            - name: MAX_PENDING_FRAMES
              value: "1000"
            - name: CONTEXT_MAX_SKEW_SECONDS
              value: "2"
            - name: VIBRATION_WINDOW_SAMPLES
              value: "20"
            - name: TEMPERATURE_WINDOW_SAMPLES
              value: "10"
            - name: VIBRATION_WEIGHT
              value: "0.7"
            - name: TEMPERATURE_WEIGHT
              value: "0.3"
            - name: MODEL_BACKEND
              value: online-baseline
            - name: MODEL_VERSION
              value: baseline-1.0.0
            - name: SERVICE_DEVICE_ID
              value: arduino-001
            - name: SERVICE_ASSET_ID
              value: arduino-001
            - name: SERVICE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RESULT_DB_PATH
              value: /var/lib/sensor-anomaly-demo/results.db
            - name: RESULT_RETENTION_ROWS
              value: "100000"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/sensor-anomaly-demo
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: sensor-anomaly-demo-state
