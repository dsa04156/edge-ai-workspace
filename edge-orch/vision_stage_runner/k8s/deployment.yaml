apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-vision-inspection-ai
  namespace: default
  labels:
    app: factory-vision-inspection-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-vision-inspection-ai
  namespace: default
  labels:
    app: factory-vision-inspection-ai
    app.kubernetes.io/name: factory-vision-inspection-ai
    edge-ai.io/scenario: jetson-vision-inspection
    edge-ai.io/target-device: etri-dev0001-jetorn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-vision-inspection-ai
  template:
    metadata:
      labels:
        app: factory-vision-inspection-ai
        app.kubernetes.io/name: factory-vision-inspection-ai
        edge-ai.io/scenario: jetson-vision-inspection
        edge-ai.io/target-device: etri-dev0001-jetorn
    spec:
      serviceAccountName: factory-vision-inspection-ai
      nodeSelector:
        kubernetes.io/hostname: etri-dev0001-jetorn
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: factory-vision-inspection-ai
          image: 192.168.0.56:5000/vision-stage-runner:latest
          imagePullPolicy: Always
          env:
            - name: SERVICE_NAME
              value: factory-vision-inspection-ai
            - name: SCENARIO_ID
              value: jetson-vision-inspection
            - name: TARGET_DEVICE
              value: etri-dev0001-jetorn
            - name: WORKFLOW_ID
              value: factory-vision-live
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: factory-vision-inspection-ai
  namespace: default
  labels:
    app: factory-vision-inspection-ai
spec:
  selector:
    app: factory-vision-inspection-ai
  ports:
    - name: http
      port: 8080
      targetPort: http
