apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-aggregator
  labels:
    app: state-aggregator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: state-aggregator
  template:
    metadata:
      labels:
        app: state-aggregator
    spec:
      serviceAccountName: state-aggregator
      nodeSelector:
        kubernetes.io/hostname: etri-ser0001-cg0msb
      containers:
        - name: state-aggregator
          image: 192.168.0.56:5000/state-aggregator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.kube-system:9090
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: DATA_DIR
              value: /app/data
            - name: INSTANCE_MAP_PATH
              value: /app/app/config/instance_map.json
            - name: INFLUXDB_URL
              value: http://influxdb.telemetry.svc.cluster.local:8086
            - name: INFLUXDB_ORG
              value: edgeai
            - name: INFLUXDB_BUCKET
              value: device_telemetry
            - name: INFLUXDB_MEASUREMENT
              value: virtual_device_telemetry
            - name: DEVICE_STATUS_FRESH_SECONDS
              value: "90"
            - name: TELEMETRY_FRESH_SECONDS
              value: "90"
            - name: MAPPER_HEARTBEAT_FRESH_SECONDS
              value: "60"
            - name: DEVICE_STATUS_BRIDGE_ENABLED
              value: "false"
            - name: DEVICE_STATUS_BRIDGE_INTERVAL_SECONDS
              value: "30"
            - name: TELEMETRY_QUERY_WINDOW
              value: "-30m"
            - name: RESOURCE_AUGMENTATION_INFERENCE_URL
              value: http://j-server-analyzer-svc.offload-test.svc.cluster.local:8000/analyze
            - name: RESOURCE_AUGMENTATION_TIMEOUT_SECONDS
              value: "30"
            - name: RESOURCE_AUGMENTATION_JOB_NAMESPACE
              value: default
            - name: RESOURCE_AUGMENTATION_JOB_IMAGE
              value: 192.168.0.56:5000/state-aggregator:latest
            - name: RESOURCE_AUGMENTATION_JOB_TTL_SECONDS
              value: "600"
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-token
                  key: token
          volumeMounts:
            - name: state-data
              mountPath: /app/data
      volumes:
        - name: state-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: state-aggregator
  labels:
    app: state-aggregator
spec:
  selector:
    app: state-aggregator
  ports:
    - name: http
      port: 8000
      targetPort: 8000
