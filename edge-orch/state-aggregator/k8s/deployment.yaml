apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-aggregator
  labels:
    app: state-aggregator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: state-aggregator
  template:
    metadata:
      labels:
        app: state-aggregator
    spec:
      serviceAccountName: state-aggregator
      nodeSelector:
        kubernetes.io/hostname: etri-ser0001-cg0msb
      containers:
        - name: state-aggregator
          image: 192.168.0.56:5000/state-aggregator@sha256:8f31ccf482b1a8cd2d725de75895524893bd65b8649a2863f5947210550f5b37
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.kube-system:9090
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: DATA_DIR
              value: /app/data
            - name: INSTANCE_MAP_PATH
              value: /app/app/config/instance_map.json
            - name: EDGEX_CORE_METADATA_URL
              value: http://edgex-core-metadata.edgex-system.svc.cluster.local:59881
            - name: EDGEX_CORE_DATA_URL
              value: http://edgex-core-data.edgex-system.svc.cluster.local:59880
            - name: EDGEX_TIMEOUT_SECONDS
              value: "10"
            - name: EDGEX_EVENT_FRESH_SECONDS
              value: "90"
            - name: SENSOR_ANOMALY_DEMO_URL
              value: http://sensor-anomaly-demo.edgex-edge.svc.cluster.local:8080
            - name: SENSOR_ANOMALY_DEMO_TIMEOUT_SECONDS
              value: "2"
          volumeMounts:
            - name: state-data
              mountPath: /app/data
      volumes:
        - name: state-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: state-aggregator
  labels:
    app: state-aggregator
spec:
  selector:
    app: state-aggregator
  ports:
    - name: http
      port: 8000
      targetPort: 8000
