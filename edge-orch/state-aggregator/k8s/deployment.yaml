apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-aggregator
  labels:
    app: state-aggregator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: state-aggregator
  template:
    metadata:
      labels:
        app: state-aggregator
    spec:
      serviceAccountName: state-aggregator
      nodeSelector:
        kubernetes.io/hostname: etri-ser0001-cg0msb
      containers:
        - name: state-aggregator
          image: 192.168.0.56:5000/state-aggregator@sha256:3786cf91523ecc43e07c76319bfcc32cac3aaabebef69f66463e3d06f29e80a8
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.kube-system:9090
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: DATA_DIR
              value: /app/data
            - name: INSTANCE_MAP_PATH
              value: /app/app/config/instance_map.json
            - name: ADAPTER_CATALOG_PATH
              value: /app/app/config/adapter_catalog.json
            - name: SERVICE_CATALOG_PATH
              value: /app/app/config/service_catalog.json
            - name: DEVICE_MANAGEMENT_ENABLED
              value: "true"
            - name: DEVICE_MANAGEMENT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: edgex-adapter-management-auth
                  key: management-hmac-key
            - name: ADAPTER_RUNTIME_MANAGEMENT_ENABLED
              value: "true"
            - name: ADAPTER_RUNTIME_MUTATION_ENABLED
              value: "true"
            - name: DEVICE_DISCOVERY_MANAGEMENT_ENABLED
              value: "true"
            - name: ADAPTER_CONTROLLER_URL
              value: http://edgex-adapter-controller.edgex-edge.svc.cluster.local:8080
            - name: ADAPTER_CONTROLLER_INTERNAL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: edgex-adapter-management-auth
                  key: internal-hmac-key
            - name: ADAPTER_CONTROLLER_TIMEOUT_SECONDS
              value: "5"
            - name: EDGEX_CORE_METADATA_URL
              value: http://edgex-core-metadata.edgex-system.svc.cluster.local:59881
            - name: EDGEX_CORE_DATA_URL
              value: http://edgex-core-data.edgex-system.svc.cluster.local:59880
            - name: EDGEX_TIMEOUT_SECONDS
              value: "10"
            - name: EDGEX_EVENT_FRESH_SECONDS
              value: "90"
            - name: SENSOR_ANOMALY_DEMO_URL
              value: http://sensor-anomaly-demo.edgex-edge.svc.cluster.local:8080
            - name: SENSOR_ANOMALY_DEMO_TIMEOUT_SECONDS
              value: "10"
            - name: DEPLOYMENT_CONTROLLER_ENABLED
              value: "true"
            - name: DEPLOYMENT_TARGET_NAMESPACE
              value: edge-ai-workloads
            - name: DEPLOYMENT_ALLOWED_IMAGE_PREFIXES
              value: "192.168.0.56:5000/state-aggregator@sha256:,192.168.0.56:5000/sensor-anomaly-demo@sha256:"
            - name: DEPLOYMENT_READY_TIMEOUT_SECONDS
              value: "90"
            - name: DEPLOYMENT_POLL_INTERVAL_SECONDS
              value: "2"
            - name: DEPLOYMENT_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: edgex-adapter-management-auth
                  key: management-hmac-key
            - name: RUNTIME_RECOMMENDATION_ENABLED
              value: "true"
            - name: RUNTIME_RECOMMENDATION_POLL_INTERVAL_SECONDS
              value: "15"
            - name: RUNTIME_RECOMMENDATION_DATABASE_PATH
              value: /app/data/runtime-recommendations.sqlite3
            - name: RUNTIME_RECOMMENDATION_HISTORY_LIMIT
              value: "1000"
            - name: EXECUTION_CONTROLLER_ENABLED
              value: "true"
            - name: EXECUTION_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: edgex-adapter-management-auth
                  key: management-hmac-key
            - name: RUNTIME_EXECUTION_DATABASE_PATH
              value: /app/data/runtime-executions.sqlite3
            - name: RUNTIME_EXECUTION_HISTORY_LIMIT
              value: "1000"
            - name: CANDIDATE_TEMPLATE_CATALOG_PATH
              value: /app/app/config/candidate_workload_templates.json
            - name: CANDIDATE_VALIDATION_CONTRACT_PATH
              value: /app/app/config/candidate_validation_contracts.json
            - name: TRAFFIC_ROUTING_CONTRACT_PATH
              value: /app/app/config/traffic_routing_contracts.json
            - name: EXECUTION_OWNERSHIP_CONTRACT_PATH
              value: /app/app/config/execution_ownership_contracts.json
          volumeMounts:
            - name: state-data
              mountPath: /app/data
      volumes:
        - name: state-data
          persistentVolumeClaim:
            claimName: state-aggregator-state
---
apiVersion: v1
kind: Service
metadata:
  name: state-aggregator
  labels:
    app: state-aggregator
spec:
  selector:
    app: state-aggregator
  ports:
    - name: http
      port: 8000
      targetPort: 8000
