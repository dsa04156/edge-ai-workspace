apiVersion: v1
kind: ServiceAccount
metadata:
  name: state-aggregator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: state-aggregator-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["devices.kubeedge.io"]
    resources: ["devices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["devices.kubeedge.io"]
    resources: ["devicestatuses"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["augmentation.edge-ai.io"]
    resources: ["augmentationresources", "deviceaugmentations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: state-aggregator-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: state-aggregator
    namespace: default
roleRef:
  kind: ClusterRole
  name: state-aggregator-node-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: state-aggregator-job-runner
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: state-aggregator-job-runner-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: state-aggregator
    namespace: default
roleRef:
  kind: Role
  name: state-aggregator-job-runner
  apiGroup: rbac.authorization.k8s.io
