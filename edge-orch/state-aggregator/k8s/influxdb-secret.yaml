apiVersion: v1
kind: Secret
metadata:
  name: influxdb-token
  # Namespace should match where state-aggregator is deployed (default if not set)
  namespace: default
type: Opaque
stringData:
  # Replace with the real InfluxDB token when applying to the cluster.
  # DO NOT commit real tokens to git. Use `kubectl create secret` or CI secrets.
  token: REPLACE_WITH_INFLUX_TOKEN
