apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: state-aggregator-augmentation-reader
rules:
  - apiGroups: ["augmentation.edge-ai.io"]
    resources: ["augmentationresources", "deviceaugmentations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: state-aggregator-augmentation-reader-binding
subjects:
  - kind: ServiceAccount
    name: state-aggregator
    namespace: default
roleRef:
  kind: ClusterRole
  name: state-aggregator-augmentation-reader
  apiGroup: rbac.authorization.k8s.io
