apiVersion: augmentation.edge-ai.io/v1alpha1
kind: DeviceAugmentation
metadata:
  name: jetson-gpu-storage-augmentation
  namespace: default
  labels:
    edge-ai.io/target-device: etri-dev0001-jetorn
spec:
  targetDevice:
    kind: EdgeNode
    name: etri-dev0001-jetorn
  augmentationPurpose: mixed
  requiredCapabilities:
    - gpu_inference
    - result_cache
  bindings:
    inferenceResource: vd-x86-gpu-inference
    storageResource: vd-storage-cache
  workloadPolicy:
    mode: read_only
    automaticOffloading: false
    runtimeMigration: false
---
apiVersion: augmentation.edge-ai.io/v1alpha1
kind: DeviceAugmentation
metadata:
  name: raspi-aihat-storage-augmentation
  namespace: default
  labels:
    edge-ai.io/target-device: etri-dev0002-raspi5
spec:
  targetDevice:
    kind: EdgeNode
    name: etri-dev0002-raspi5
  augmentationPurpose: mixed
  requiredCapabilities:
    - lightweight_inference
    - model_cache
  bindings:
    inferenceResource: vd-aihat-inference
    storageResource: vd-storage-cache
  workloadPolicy:
    mode: read_only
    automaticOffloading: false
    runtimeMigration: false
