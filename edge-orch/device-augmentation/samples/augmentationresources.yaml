apiVersion: augmentation.edge-ai.io/v1alpha1
kind: AugmentationResource
metadata:
  name: vd-aihat-inference
  labels:
    edge-ai.io/resource-class: ai-hat
spec:
  displayName: AI HAT Inference
  resourceType: ai-hat
  nodeSelector:
    kubernetes.io/hostname: etri-dev0002-raspi5
  stageTypes:
    - ai_inference
  capabilities:
    - lightweight_inference
    - npu_inference
  runtimeRef:
    namespace: default
    podSelector:
      edge-ai.io/augmentation-resource: vd-aihat-inference
  allocationPolicy:
    maxBindings: 2
    allowShared: true
---
apiVersion: augmentation.edge-ai.io/v1alpha1
kind: AugmentationResource
metadata:
  name: vd-x86-gpu-inference
  labels:
    edge-ai.io/resource-class: gpu
spec:
  displayName: x86 GPU Inference
  resourceType: gpu
  nodeSelector:
    kubernetes.io/hostname: etri-ser0002-cgnmsb
  stageTypes:
    - ai_inference
  capabilities:
    - gpu_inference
    - vision_inference
    - anomaly_model
  runtimeRef:
    namespace: default
    podSelector:
      edge-ai.io/augmentation-resource: vd-x86-gpu-inference
  allocationPolicy:
    maxBindings: 4
    allowShared: true
---
