---
apiVersion: augmentation.edge-ai.io/v1alpha1
kind: AugmentationResource
metadata:
  name: vd-storage-cache
  labels:
    edge-ai.io/resource-class: storage-cache
spec:
  displayName: Storage Cache
  resourceType: storage-cache
  nodeSelector:
    kubernetes.io/hostname: etri-ser0002-cgnmsb
  stageTypes:
    - result_cache
    - storage
  capabilities:
