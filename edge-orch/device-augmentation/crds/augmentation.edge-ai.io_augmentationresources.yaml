apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: augmentationresources.augmentation.edge-ai.io
  labels:
    app.kubernetes.io/name: device-augmentation
    app.kubernetes.io/part-of: edge-ai-platform
  annotations:
    edge-ai.io/scope: "resource-augmentation"
    edge-ai.io/description: "Declares compute or storage resources that can augment an edge device."
spec:
  group: augmentation.edge-ai.io
  scope: Cluster
  names:
    plural: augmentationresources
    singular: augmentationresource
    kind: AugmentationResource
    listKind: AugmentationResourceList
    shortNames:
      - augres
      - vdr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.resourceType
        - name: Node
          type: string
          jsonPath: .spec.nodeSelector.kubernetes\.io/hostname
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Observed
          type: integer
          jsonPath: .status.observedInstances
        - name: Binding
          type: string
          jsonPath: .status.bindingState
        - name: Endpoint
          type: boolean
          jsonPath: .status.endpointReady
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - resourceType
                - capabilities
                - stageTypes
              properties:
                displayName:
                  type: string
                resourceType:
                  type: string
                  enum:
                    - ai-hat
                    - gpu
                    - gpu-lite
                    - npu
                    - cpu
                    - storage-cache
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                stageTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - preprocess
                      - ai_inference
                      - result_cache
                      - model_cache
                      - storage
                capabilities:
                  type: array
                  minItems: 1
                  items:
                    type: string
                runtimeRef:
                  type: object
                  properties:
                    namespace:
                      type: string
                    serviceSelector:
                      type: object
                      additionalProperties:
                        type: string
                    podSelector:
                      type: object
                      additionalProperties:
                        type: string
                allocationPolicy:
                  type: object
                  properties:
                    maxBindings:
                      type: integer
                      minimum: 1
                    allowShared:
                      type: boolean
                      default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Available
                    - Allocated
                    - Degraded
                    - Unavailable
                    - Unknown
                observedInstances:
                  type: integer
                  minimum: 0
                freeInstances:
                  type: integer
                  minimum: 0
                allocatedInstances:
                  type: integer
                  minimum: 0
                bindingState:
                  type: string
                  enum:
                    - available
                    - allocated
                    - partially_available
                    - not_running
                    - degraded
                    - unavailable
                    - unknown
                nodeReady:
                  type: boolean
                podReady:
                  type: boolean
                endpointReady:
                  type: boolean
                reason:
                  type: string
                lastObservedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
