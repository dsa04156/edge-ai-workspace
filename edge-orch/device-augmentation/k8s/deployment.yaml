apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-augmentation-controller
  namespace: default
  labels:
    app: device-augmentation-controller
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: device-augmentation-controller
  template:
    metadata:
      labels:
        app: device-augmentation-controller
    spec:
      serviceAccountName: device-augmentation-controller
      nodeSelector:
        kubernetes.io/hostname: etri-ser0001-cg0msb
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: 192.168.0.56:5000/device-augmentation-controller:latest
          imagePullPolicy: Always
          env:
            - name: STATE_AGGREGATOR_URL
              value: http://state-aggregator.default.svc.cluster.local:8000
            - name: AUGMENTATION_NAMESPACE
              value: default
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import app.main
            initialDelaySeconds: 15
            timeoutSeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import app.main
            initialDelaySeconds: 5
            timeoutSeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-augmentation-controller-egress
  namespace: default
  labels:
    app: device-augmentation-controller
spec:
  podSelector:
    matchLabels:
      app: device-augmentation-controller
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: state-aggregator
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
