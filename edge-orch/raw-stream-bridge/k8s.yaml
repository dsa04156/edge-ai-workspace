apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: raw-stream-bridge-config
  namespace: default
data:
  MQTT_HOST: "127.0.0.1"
  MQTT_PORT: "1883"
  MQTT_TOPICS: "factory/devices/+/telemetry,etri/+/+/+"
  REDIS_URL: "redis://redis.telemetry.svc.cluster.local:6379/0"
  STREAM_KEY: "telemetry:raw"
  LATEST_PREFIX: "telemetry:latest"
  LATEST_TTL_SECONDS: "60"
  INFLUX_URL: "http://influxdb.telemetry.svc.cluster.local:8086"
  INFLUX_ORG: "edgeai"
  INFLUX_BUCKET: "device_telemetry"
  INFLUX_MEASUREMENT: "raw_sensor_telemetry"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: telemetry
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: raw-stream-bridge
  namespace: default
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: raw-stream-bridge
  template:
    metadata:
      labels:
        app: raw-stream-bridge
    spec:
      nodeSelector:
        environment: edge
        edge.device/mapper: mqttvirtual
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: raw-stream-bridge
          image: 192.168.0.56:5000/raw-stream-bridge:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: raw-stream-bridge-config
          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-token
                  key: token
                  optional: true
