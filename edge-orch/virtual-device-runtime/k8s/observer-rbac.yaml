# Optional, separately approved reader access; intentionally excluded from kustomization.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: virtual-device-observer
  namespace: virtual-device-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: virtual-device-observer
  namespace: virtual-device-test
subjects:
  - kind: ServiceAccount
    name: state-aggregator
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: virtual-device-observer
