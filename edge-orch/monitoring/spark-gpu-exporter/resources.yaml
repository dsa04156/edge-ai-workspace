apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spark-gpu-exporter
  labels: {app: spark-gpu-exporter}
spec:
  selector:
    matchLabels: {app: spark-gpu-exporter}
  template:
    metadata:
      labels: {app: spark-gpu-exporter}
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia-spark
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: arm64
        monitoring.jinuk.io/gpu-collector: spark-nvidia-smi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          image: python:3.11-slim@sha256:6c5ae9d998f4cc06f892f428d7af53a566c24ad0dc29fa572696b647cf2762a7
          command: [python, -B, /app/exporter.py]
          env:
            - {name: NVIDIA_VISIBLE_DEVICES, value: all}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: utility}
          ports:
            - {name: metrics, containerPort: 9402}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            timeoutSeconds: 5
            periodSeconds: 30
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap: {name: spark-gpu-exporter-code}
---
apiVersion: v1
kind: Service
metadata:
  name: spark-gpu-exporter
  labels: {app: spark-gpu-exporter}
spec:
  selector: {app: spark-gpu-exporter}
  ports:
    - {name: metrics, port: 9402, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spark-gpu-exporter
  labels: {app: spark-gpu-exporter, release: prometheus}
spec:
  jobLabel: app
  selector:
    matchLabels: {app: spark-gpu-exporter}
  namespaceSelector:
    matchNames: [kube-system]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_host_ip]
          targetLabel: instance
          replacement: '${1}:9100'
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
