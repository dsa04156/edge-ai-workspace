apiVersion: v1
kind: Pod
metadata:
  name: cuda-share-a
  labels: {app.kubernetes.io/name: cuda-sharing-probe}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: etri-dev0005-jetagx
  containers:
    - name: probe
      image: docker.io/library/python@sha256:3949e4271b0a3ff82afac7306764c313dcc8edeeb89c0376a3c2ac6007c66b1d
      command: [python3, /probe/probe.py]
      env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
        - {name: PROBE_SECONDS, value: "60"}
      resources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {cpu: 250m, memory: 256Mi, nvidia.com/gpu.shared: 1}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: probe, mountPath: /probe, readOnly: true}
  volumes:
    - name: probe
      configMap: {name: cuda-sharing-probe}
---
