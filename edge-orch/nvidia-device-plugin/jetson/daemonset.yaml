apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-jetson-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvidia-jetson-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-jetson-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-jetson-device-plugin
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/hostname: etri-dev0005-jetagx
        kubernetes.io/arch: arm64
        kubernetes.io/os: linux
      containers:
        - name: device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin@sha256:d2569d771ea77b94371b58e430fbf4a36ac7d2a79874cd0c5617ebd9cb1da220
          args: [--config-file=/config/config.yaml]
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: config
          configMap:
            name: nvidia-jetson-timeslicing
