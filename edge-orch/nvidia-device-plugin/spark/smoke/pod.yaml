apiVersion: v1
kind: Pod
metadata:
  name: dgx-cuda-smoke
spec:
  runtimeClassName: nvidia-spark
  restartPolicy: Never
  activeDeadlineSeconds: 180
  terminationGracePeriodSeconds: 2
  automountServiceAccountToken: false
  containers:
    - name: cuda
      image: python:3.11-slim
      command: [python3, /smoke/cuda_smoke.py]
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        limits:
          nvidia.com/gpu: 1
          memory: 256Mi
          cpu: "1"
        requests:
          cpu: 50m
          memory: 64Mi
      volumeMounts:
        - name: smoke
          mountPath: /smoke
          readOnly: true
  volumes:
    - name: smoke
      configMap:
        name: dgx-cuda-smoke
