apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: env-arduino-temperature-01
  namespace: default
spec:
  deviceModelRef:
    name: jetson-sensor-temperature-model
  nodeName: etri-dev0001-jetorn
  properties:
  - collectCycle: 5000
    name: raw
    reportCycle: 5000
    reportToCloud: false
    visitors:
      configData:
        dataType: string
        jsonKey: raw
      protocolName: mqttvirtual
    pushMethod:
      dbMethod:
        influxdb2:
          influxdb2ClientConfig:
            url: http://influxdb.telemetry.svc.cluster.local:8086
            org: edgeai
            bucket: device_telemetry
          influxdb2DataConfig:
            measurement: virtual_device_telemetry
            tag:
              device_id: env-arduino-temperature-01
              property: raw
            fieldKey: value
  - name: health
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: health
  - name: severity
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: severity
  - name: online
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: online
  - name: mapperLastSeen
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: mapperLastSeen
  - name: statusLastSeen
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: statusLastSeen
  - name: statusSource
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: statusSource
  - name: last_error_code
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: last_error_code
  - name: last_error_message
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: last_error_message
  protocol:
    configData:
      broker: tcp://127.0.0.1:1883
      clientID: env-arduino-temperature-01-client
      offlineAfterMs: 15000
      password: ''
      pubTopic: factory/devices/env-arduino-temperature-01/command
      qos: 1
      subTopic: etri/etri-dev0001-jetorn/arduino-001/temperature
      username: ''
    protocolName: mqttvirtual
