apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: env-arduino-light-01
  namespace: default
spec:
  deviceModelRef:
    name: jetson-sensor-light-model
  nodeName: etri-dev0001-jetorn
  properties:
  - collectCycle: 5000
    name: value
    reportCycle: 5000
    reportToCloud: false
    visitors:
      configData:
        dataType: string
        jsonKey: value
      protocolName: mqttvirtual
  - name: health
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: health
  - name: severity
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: severity
  - name: online
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: online
  - name: mapperLastSeen
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: mapperLastSeen
  - name: statusLastSeen
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: statusLastSeen
  - name: statusSource
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: statusSource
  - name: last_error_code
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: last_error_code
  - name: last_error_message
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: last_error_message
  protocol:
    configData:
      broker: tcp://127.0.0.1:1883
      clientID: env-arduino-light-01-client
      offlineAfterMs: 15000
      password: ''
      pubTopic: factory/devices/env-arduino-light-01/command
      qos: 1
      subTopic: etri/etri-dev0001-jetorn/arduino-001/light
      username: ''
    protocolName: mqttvirtual
