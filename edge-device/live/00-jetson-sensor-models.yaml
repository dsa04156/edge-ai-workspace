apiVersion: devices.kubeedge.io/v1beta1
kind: DeviceModel
metadata:
  name: jetson-sensor-temperature-model
  namespace: default
spec:
  protocol: mqttvirtual
  properties:
  - name: raw
    description: raw temperature reading from serial sensor collector
    type: STRING
    accessMode: ReadOnly
  - name: mapperLastSeen
    description: mapper heartbeat timestamp
    type: STRING
    accessMode: ReadOnly
  - name: statusLastSeen
    description: DeviceStatus heartbeat timestamp
    type: STRING
    accessMode: ReadOnly
  - name: statusSource
    description: DeviceStatus summary source
    type: STRING
    accessMode: ReadOnly
  - name: last_error_code
    description: last mapper status error code
    type: STRING
    accessMode: ReadOnly
  - name: last_error_message
    description: last mapper status error message
    type: STRING
    accessMode: ReadOnly
---
