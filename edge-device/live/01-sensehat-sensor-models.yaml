apiVersion: devices.kubeedge.io/v1beta1
kind: DeviceModel
metadata:
  name: sensehat-sensor-temperature-model
  namespace: default
spec:
  protocol: mqttvirtual
  properties:
  - name: temp_humidity
    description: temperature reading derived from Sense HAT humidity sensor
    type: STRING
    accessMode: ReadOnly
  - name: temp_pressure
    description: temperature reading derived from Sense HAT pressure sensor
    type: STRING
    accessMode: ReadOnly
  - name: mapperLastSeen
    description: mapper heartbeat timestamp
    type: STRING
    accessMode: ReadOnly
  - name: statusLastSeen
    description: DeviceStatus heartbeat timestamp
    type: STRING
    accessMode: ReadOnly
  - name: statusSource
    description: DeviceStatus summary source
    type: STRING
    accessMode: ReadOnly
  - name: last_error_code
    description: last mapper status error code
    type: STRING
    accessMode: ReadOnly
  - name: last_error_message
    description: last mapper status error message
    type: STRING
    accessMode: ReadOnly
---
