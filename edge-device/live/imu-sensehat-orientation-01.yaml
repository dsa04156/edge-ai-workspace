apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: imu-sensehat-orientation-01
  namespace: default
spec:
  deviceModelRef:
    name: sensehat-sensor-orientation-model
  nodeName: etri-dev0003-raspi5
  properties:
  - collectCycle: 1000
    name: pitch
    reportCycle: 1000
    reportToCloud: false
    visitors:
      configData:
        dataType: string
        jsonKey: pitch
      protocolName: mqttvirtual
    pushMethod:
      dbMethod:
        influxdb2:
          influxdb2ClientConfig:
            url: http://influxdb.telemetry.svc.cluster.local:8086
            org: edgeai
            bucket: device_telemetry
          influxdb2DataConfig:
            measurement: virtual_device_telemetry
            tag:
              device_id: imu-sensehat-orientation-01
              property: pitch
            fieldKey: value
  - collectCycle: 1000
    name: roll
    reportCycle: 1000
    reportToCloud: false
    visitors:
      configData:
        dataType: string
        jsonKey: roll
      protocolName: mqttvirtual
    pushMethod:
      dbMethod:
        influxdb2:
          influxdb2ClientConfig:
            url: http://influxdb.telemetry.svc.cluster.local:8086
            org: edgeai
            bucket: device_telemetry
          influxdb2DataConfig:
            measurement: virtual_device_telemetry
            tag:
              device_id: imu-sensehat-orientation-01
              property: roll
            fieldKey: value
  - collectCycle: 1000
    name: yaw
    reportCycle: 1000
    reportToCloud: false
    visitors:
      configData:
        dataType: string
        jsonKey: yaw
      protocolName: mqttvirtual
    pushMethod:
      dbMethod:
        influxdb2:
          influxdb2ClientConfig:
            url: http://influxdb.telemetry.svc.cluster.local:8086
            org: edgeai
            bucket: device_telemetry
          influxdb2DataConfig:
            measurement: virtual_device_telemetry
            tag:
              device_id: imu-sensehat-orientation-01
              property: yaw
            fieldKey: value
  - name: mapperLastSeen
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: mapperLastSeen
  - name: statusLastSeen
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: statusLastSeen
  - name: statusSource
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: statusSource
  - name: last_error_code
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: last_error_code
  - name: last_error_message
    collectCycle: 60000
    reportCycle: 60000
    reportToCloud: true
    visitors:
      protocolName: mqttvirtual
      configData:
        dataType: string
        jsonKey: last_error_message
  protocol:
    configData:
      broker: tcp://127.0.0.1:1883
      clientID: imu-sensehat-orientation-01-client
      offlineAfterMs: 15000
      password: ''
      pubTopic: factory/devices/imu-sensehat-orientation-01/command
      qos: 1
      subTopic: etri/etri-dev0003-raspi5/sensehat-001/orientation
      username: ''
    protocolName: mqttvirtual
