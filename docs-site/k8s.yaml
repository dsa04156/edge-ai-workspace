apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-html
  namespace: default
  labels:
    app: docs-html
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-html
  template:
    metadata:
      labels:
        app: docs-html
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: nginx
          image: 192.168.0.56:5000/docs-html:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docs-html
  namespace: default
  labels:
    app: docs-html
spec:
  selector:
    app: docs-html
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: docs-html
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`docs.192.168.0.56.sslip.io`)
      kind: Rule
      services:
        - name: docs-html
          port: 80
