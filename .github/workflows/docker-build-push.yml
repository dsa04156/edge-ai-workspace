name: Build and Push Images to Local Registry

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-build-push.yml"
      - ".github/buildkitd.toml"
      - "edge-orch/state-aggregator/**"
      - "edge-orch/workflow_executor/**"
      - "edge-orch/placement_engine/**"
      - "edge-orch/vision_stage_runner/**"
      - "mappers/mqttvirtual/**"
      - "mappers/mapper-framework/**"
      - "docs/**"
      - "docs-site/**"
  workflow_dispatch:

env:
  REGISTRY: 192.168.0.56:5000

jobs:
  build-and-push:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="__ALL__"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -z "${BEFORE}" ] || [[ "${BEFORE}" =~ ^0+$ ]]; then
              CHANGED="__ALL__"
            else
              CHANGED="$(git diff --name-only "${BEFORE}" "${SHA}")"
            fi
          fi

          echo "Changed files:"
          printf '%s\n' "${CHANGED}"

          has_change() {
            local pattern="$1"
            if [ "${CHANGED}" = "__ALL__" ]; then
              return 0
            fi
            printf '%s\n' "${CHANGED}" | grep -E "${pattern}" >/dev/null
          }

          set_output() {
            local name="$1"
            local pattern="$2"
            if has_change "${pattern}"; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          COMMON='^(\.github/workflows/docker-build-push\.yml|\.github/buildkitd\.toml)$'
          set_output state_aggregator "${COMMON}|^edge-orch/state-aggregator/"
          set_output workflow_executor "${COMMON}|^edge-orch/workflow_executor/"
          set_output placement_engine "${COMMON}|^edge-orch/placement_engine/"
          set_output vision_stage_runner "${COMMON}|^edge-orch/vision_stage_runner/"
          set_output mqttvirtual "${COMMON}|^mappers/(mqttvirtual|mapper-framework)/"
          set_output docs "${COMMON}|^(docs|docs-site)/"

      - name: Configure Buildx for Local Registry
        run: |
          docker buildx rm edgeai-builder || true
          docker buildx create \
            --name edgeai-builder \
            --driver docker-container \
            --config .github/buildkitd.toml \
            --use \
            --bootstrap

      - name: Build and Push state-aggregator
        if: steps.changes.outputs.state_aggregator == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/state-aggregator:latest \
            -f edge-orch/state-aggregator/Dockerfile \
            edge-orch/state-aggregator \
            --push

      - name: Build and Push workflow-executor
        if: steps.changes.outputs.workflow_executor == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/workflow-executor:latest \
            -f edge-orch/workflow_executor/Dockerfile \
            edge-orch/workflow_executor \
            --push

      - name: Build and Push placement-engine
        if: steps.changes.outputs.placement_engine == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/placement-engine:latest \
            -f edge-orch/placement_engine/Dockerfile \
            edge-orch/placement_engine \
            --push

      - name: Build and Push vision-stage-runner
        if: steps.changes.outputs.vision_stage_runner == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/vision-stage-runner:latest \
            -f edge-orch/vision_stage_runner/Dockerfile \
            edge-orch/vision_stage_runner \
            --push

      - name: Build and Push mqttvirtual mapper
        if: steps.changes.outputs.mqttvirtual == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/mqttvirtual:latest \
            -f mappers/mqttvirtual/Dockerfile_nostream \
            mappers \
            --push

      - name: Generate docs HTML
        if: steps.changes.outputs.docs == 'true'
        run: |
          python3 scripts/build-docs-html.py

      - name: Build and Push docs-html
        if: steps.changes.outputs.docs == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/docs-html:latest \
            -f docs-site/Dockerfile \
            . \
            --push

      - name: Deploy state-aggregator latest image
        if: steps.changes.outputs.state_aggregator == 'true'
        run: |
          CURRENT_IMAGE=$(kubectl get deployment state-aggregator -n default -o jsonpath='{.spec.template.spec.containers[?(@.name=="state-aggregator")].image}')
          TARGET_IMAGE=${{ env.REGISTRY }}/state-aggregator:latest

          kubectl set image deployment/state-aggregator \
            state-aggregator=${TARGET_IMAGE} \
            -n default

          if [ "${CURRENT_IMAGE}" = "${TARGET_IMAGE}" ]; then
            kubectl rollout restart deployment/state-aggregator -n default
          fi

          kubectl rollout status deployment/state-aggregator -n default --timeout=180s

      - name: Deploy mqttvirtual mapper latest image
        if: steps.changes.outputs.mqttvirtual == 'true'
        run: |
          CURRENT_IMAGE=$(kubectl get daemonset mqttvirtual-mapper -n default -o jsonpath='{.spec.template.spec.containers[?(@.name=="mqttvirtual")].image}')
          TARGET_IMAGE=${{ env.REGISTRY }}/mqttvirtual:latest

          kubectl set image daemonset/mqttvirtual-mapper \
            mqttvirtual=${TARGET_IMAGE} \
            -n default

          if [ "${CURRENT_IMAGE}" = "${TARGET_IMAGE}" ]; then
            kubectl rollout restart daemonset/mqttvirtual-mapper -n default
          fi

          kubectl rollout status daemonset/mqttvirtual-mapper -n default --timeout=180s
