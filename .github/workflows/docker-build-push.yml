name: Build and Push Images to Local Registry

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-build-push.yml"
      - ".github/buildkitd.toml"
      - "edge-orch/state-aggregator/**"
      - "edge-orch/workflow_executor/**"
      - "edge-orch/placement_engine/**"
      - "edge-orch/vision_stage_runner/**"
      - "edgex/adapter-controller/**"
      - "edgex/device-discovery-agent/**"
      - "edgex/device-serial/**"
      - "edgex/device-sensehat/**"
      - "edgex/local-data-cache/**"
      - "edgex/k8s/**"
      - "mappers/mqttvirtual/**"
      - "mappers/mapper-framework/**"
      - "docs/**"
      - "docs-site/**"
      # - "llm/edge-agent/**"
      # - "llm/ollama-qwen3.yaml"
  workflow_dispatch:

env:
  REGISTRY: 192.168.0.56:5000

jobs:
  build-and-push:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="__ALL__"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ -z "${BEFORE}" ] || [[ "${BEFORE}" =~ ^0+$ ]]; then
              CHANGED="__ALL__"
            else
              CHANGED="$(git diff --name-only "${BEFORE}" "${SHA}")"
            fi
          fi

          echo "Changed files:"
          printf '%s\n' "${CHANGED}"

          has_change() {
            local pattern="$1"
            if [ "${CHANGED}" = "__ALL__" ]; then
              return 0
            fi
            printf '%s\n' "${CHANGED}" | grep -E "${pattern}" >/dev/null
          }

          set_output() {
            local name="$1"
            local pattern="$2"
            if has_change "${pattern}"; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          COMMON='^(\.github/workflows/docker-build-push\.yml|\.github/buildkitd\.toml)$'
          set_output state_aggregator "${COMMON}|^edge-orch/state-aggregator/"
          set_output workflow_executor "${COMMON}|^edge-orch/workflow_executor/"
          set_output placement_engine "${COMMON}|^edge-orch/placement_engine/"
          set_output vision_stage_runner "${COMMON}|^edge-orch/vision_stage_runner/"
          set_output adapter_stack "${COMMON}|^edgex/(adapter-controller|device-discovery-agent|device-serial|device-sensehat|local-data-cache|k8s)/"
          set_output mqttvirtual "${COMMON}|^mappers/(mqttvirtual|mapper-framework)/"
          set_output docs "${COMMON}|^(docs|docs-site)/"

      - name: Configure Buildx for Local Registry
        run: |
          docker buildx rm edgeai-builder || true
          docker buildx create \
            --name edgeai-builder \
            --driver docker-container \
            --config .github/buildkitd.toml \
            --use \
            --bootstrap

      - name: Build and Push state-aggregator
        if: steps.changes.outputs.state_aggregator == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/state-aggregator:latest \
            -f edge-orch/state-aggregator/Dockerfile \
            edge-orch/state-aggregator \
            --metadata-file /tmp/state-aggregator-build-metadata.json \
            --push
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/state-aggregator-build-metadata.json)
          test -n "${DIGEST}" && test "${DIGEST}" != "null"
          echo "STATE_AGGREGATOR_IMAGE=${{ env.REGISTRY }}/state-aggregator@${DIGEST}" >> "$GITHUB_ENV"

      - name: Build and Push edge-device-discovery
        if: steps.changes.outputs.adapter_stack == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/edge-device-discovery:latest \
            -f edgex/device-discovery-agent/Dockerfile \
            edgex/device-discovery-agent \
            --metadata-file /tmp/edge-device-discovery-build-metadata.json \
            --push
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/edge-device-discovery-build-metadata.json)
          test -n "${DIGEST}" && test "${DIGEST}" != "null"
          echo "EDGE_DEVICE_DISCOVERY_IMAGE=${{ env.REGISTRY }}/edge-device-discovery@${DIGEST}" >> "$GITHUB_ENV"

      - name: Build and Push edgex-device-serial
        if: steps.changes.outputs.adapter_stack == 'true'
        run: |
          docker buildx build --platform linux/arm64 \
            -t ${{ env.REGISTRY }}/edgex-device-serial:latest \
            -f edgex/device-serial/Dockerfile \
            edgex \
            --metadata-file /tmp/edgex-device-serial-build-metadata.json \
            --push
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/edgex-device-serial-build-metadata.json)
          test -n "${DIGEST}" && test "${DIGEST}" != "null"
          echo "EDGEX_DEVICE_SERIAL_IMAGE=${{ env.REGISTRY }}/edgex-device-serial@${DIGEST}" >> "$GITHUB_ENV"

      - name: Build and Push edgex-device-sensehat
        if: steps.changes.outputs.adapter_stack == 'true'
        run: |
          docker buildx build --platform linux/arm64 \
            -t ${{ env.REGISTRY }}/edgex-device-sensehat:latest \
            -f edgex/device-sensehat/Dockerfile \
            edgex \
            --metadata-file /tmp/edgex-device-sensehat-build-metadata.json \
            --push
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/edgex-device-sensehat-build-metadata.json)
          test -n "${DIGEST}" && test "${DIGEST}" != "null"
          echo "EDGEX_DEVICE_SENSEHAT_IMAGE=${{ env.REGISTRY }}/edgex-device-sensehat@${DIGEST}" >> "$GITHUB_ENV"

      - name: Resolve verified Device Service digests in controller catalogs
        if: steps.changes.outputs.adapter_stack == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EDGEX_DEVICE_SERIAL_IMAGE}"
          test -n "${EDGEX_DEVICE_SENSEHAT_IMAGE}"
          SERIAL_REPOSITORY=${EDGEX_DEVICE_SERIAL_IMAGE%@sha256:*}
          SENSEHAT_REPOSITORY=${EDGEX_DEVICE_SENSEHAT_IMAGE%@sha256:*}
          RUNTIME_CATALOG=$(mktemp)
          DEVICE_CATALOG=$(mktemp)
          jq \
            --arg serial "${EDGEX_DEVICE_SERIAL_IMAGE}" \
            --arg sensehat "${EDGEX_DEVICE_SENSEHAT_IMAGE}" \
            '(.templates[] | select(.adapterId == "serial-jetson") | .image) = $serial
             | (.templates[] | select(.adapterId == "sensehat-raspi") | .image) = $sensehat' \
            edgex/adapter-controller/config/runtime_templates.json \
            > "${RUNTIME_CATALOG}"
          jq \
            --arg serial "${EDGEX_DEVICE_SERIAL_IMAGE}" \
            --arg serial_repository "${SERIAL_REPOSITORY}" \
            --arg sensehat "${EDGEX_DEVICE_SENSEHAT_IMAGE}" \
            --arg sensehat_repository "${SENSEHAT_REPOSITORY}" \
            '.imageAllowlist = (
               [.imageAllowlist[]
                | select(startswith($serial_repository + "@") | not)
                | select(startswith($sensehat_repository + "@") | not)]
               + [$serial, $sensehat]
             )
             | (.bindings[]
                | select(.adapter.runtimeAdapterId == "serial-jetson")
                | .adapter.image) = $serial
             | (.bindings[]
                | select(.adapter.runtimeAdapterId == "sensehat-raspi")
                | .adapter.image) = $sensehat' \
            edgex/adapter-controller/config/device_bindings.json \
            > "${DEVICE_CATALOG}"
          mv "${RUNTIME_CATALOG}" \
            edgex/adapter-controller/config/runtime_templates.json
          mv "${DEVICE_CATALOG}" \
            edgex/adapter-controller/config/device_bindings.json

      - name: Build and Push edge-adapter-controller
        if: steps.changes.outputs.adapter_stack == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/edge-adapter-controller:latest \
            -f edgex/adapter-controller/Dockerfile \
            edgex/adapter-controller \
            --metadata-file /tmp/edge-adapter-controller-build-metadata.json \
            --push
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/edge-adapter-controller-build-metadata.json)
          test -n "${DIGEST}" && test "${DIGEST}" != "null"
          echo "EDGE_ADAPTER_CONTROLLER_IMAGE=${{ env.REGISTRY }}/edge-adapter-controller@${DIGEST}" >> "$GITHUB_ENV"

      - name: Build and Push workflow-executor
        if: steps.changes.outputs.workflow_executor == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/workflow-executor:latest \
            -f edge-orch/workflow_executor/Dockerfile \
            edge-orch/workflow_executor \
            --push

      - name: Build and Push placement-engine
        if: steps.changes.outputs.placement_engine == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/placement-engine:latest \
            -f edge-orch/placement_engine/Dockerfile \
            edge-orch/placement_engine \
            --push

      - name: Build and Push vision-stage-runner
        if: steps.changes.outputs.vision_stage_runner == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/vision-stage-runner:latest \
            -f edge-orch/vision_stage_runner/Dockerfile \
            edge-orch/vision_stage_runner \
            --push

      - name: Build and Push mqttvirtual mapper
        if: steps.changes.outputs.mqttvirtual == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/mqttvirtual:latest \
            -f mappers/mqttvirtual/Dockerfile_nostream \
            mappers \
            --push

      - name: Generate docs HTML
        if: steps.changes.outputs.docs == 'true'
        run: |
          python3 scripts/build-docs-html.py

      - name: Build and Push docs-html
        if: steps.changes.outputs.docs == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.REGISTRY }}/docs-html:latest \
            -f docs-site/Dockerfile \
            . \
            --metadata-file /tmp/docs-html-build-metadata.json \
            --push
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/docs-html-build-metadata.json)
          test -n "${DIGEST}" && test "${DIGEST}" != "null"
          echo "DOCS_HTML_IMAGE=${{ env.REGISTRY }}/docs-html@${DIGEST}" >> "$GITHUB_ENV"

      # - name: Build and Push edge-agent
      #   if: steps.changes.outputs.edge_agent == 'true'
      #   run: |
      #     docker buildx build --platform linux/amd64 \
      #       -t ${{ env.REGISTRY }}/edge-agent:latest \
      #       -f llm/edge-agent/Dockerfile \
      #       llm/edge-agent \
      #       --push

      - name: Deploy docs-html latest image
        if: steps.changes.outputs.docs == 'true'
        run: |
          test -n "${DOCS_HTML_IMAGE}"
          kubectl patch application docs-html -n argocd --type=merge \
            -p "{\"spec\":{\"source\":{\"kustomize\":{\"images\":[\"${DOCS_HTML_IMAGE}\"]}}}}"
          kubectl annotate application docs-html -n argocd \
            argocd.argoproj.io/refresh=hard \
            --overwrite
          kubectl rollout status deployment/docs-html -n default --timeout=180s

      - name: Deploy EdgeX adapter management images through Argo CD
        if: steps.changes.outputs.adapter_stack == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EDGE_ADAPTER_CONTROLLER_IMAGE}"
          test -n "${EDGE_DEVICE_DISCOVERY_IMAGE}"
          test -n "${EDGEX_DEVICE_SERIAL_IMAGE}"
          test -n "${EDGEX_DEVICE_SENSEHAT_IMAGE}"
          edgex/k8s/scripts/preflight-adapter-management-secrets.sh

          CURRENT_IMAGES=$(kubectl get application edgex-telemetry -n argocd -o json \
            | jq -c '.spec.source.kustomize.images // []')
          for TARGET_IMAGE in \
            "${EDGE_ADAPTER_CONTROLLER_IMAGE}" \
            "${EDGE_DEVICE_DISCOVERY_IMAGE}" \
            "${EDGEX_DEVICE_SERIAL_IMAGE}" \
            "${EDGEX_DEVICE_SENSEHAT_IMAGE}"; do
            TARGET_REPOSITORY=${TARGET_IMAGE%@sha256:*}
            CURRENT_IMAGES=$(jq -c \
              --arg repository "${TARGET_REPOSITORY}" \
              --arg image "${TARGET_IMAGE}" \
              '[.[] | select((sub("@sha256:[0-9a-f]+$"; "") | sub(":[^/:]+$"; "")) != $repository)] + [$image]' \
              <<<"${CURRENT_IMAGES}")
          done
          PATCH=$(jq -nc \
            --arg revision "${{ github.sha }}" \
            --argjson images "${CURRENT_IMAGES}" \
            '{spec:{source:{targetRevision:$revision,kustomize:{images:$images}}}}')
          kubectl patch application edgex-telemetry -n argocd \
            --type=merge -p "${PATCH}"
          kubectl annotate application edgex-telemetry -n argocd \
            argocd.argoproj.io/refresh=hard \
            --overwrite

          for attempt in $(seq 1 90); do
            CONTROLLER_IMAGE=$(kubectl get deployment edgex-adapter-controller -n edgex-edge \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            DISCOVERY_IMAGE=$(kubectl get daemonset edge-device-discovery -n edgex-edge \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            I2C_DISCOVERY_IMAGE=$(kubectl get daemonset edge-device-discovery-i2c -n edgex-edge \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            SERIAL_IMAGE=$(kubectl get deployment device-serial-jetson -n edgex-edge \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            SENSEHAT_IMAGE=$(kubectl get deployment device-sensehat-raspi -n edgex-edge \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [ "${CONTROLLER_IMAGE}" = "${EDGE_ADAPTER_CONTROLLER_IMAGE}" ] \
              && [ "${DISCOVERY_IMAGE}" = "${EDGE_DEVICE_DISCOVERY_IMAGE}" ] \
              && [ "${I2C_DISCOVERY_IMAGE}" = "${EDGE_DEVICE_DISCOVERY_IMAGE}" ] \
              && [ "${SERIAL_IMAGE}" = "${EDGEX_DEVICE_SERIAL_IMAGE}" ] \
              && [ "${SENSEHAT_IMAGE}" = "${EDGEX_DEVICE_SENSEHAT_IMAGE}" ]; then
              break
            fi
            sleep 2
          done
          test "${CONTROLLER_IMAGE}" = "${EDGE_ADAPTER_CONTROLLER_IMAGE}"
          test "${DISCOVERY_IMAGE}" = "${EDGE_DEVICE_DISCOVERY_IMAGE}"
          test "${I2C_DISCOVERY_IMAGE}" = "${EDGE_DEVICE_DISCOVERY_IMAGE}"
          test "${SERIAL_IMAGE}" = "${EDGEX_DEVICE_SERIAL_IMAGE}"
          test "${SENSEHAT_IMAGE}" = "${EDGEX_DEVICE_SENSEHAT_IMAGE}"
          kubectl rollout status deployment/edgex-adapter-controller -n edgex-edge --timeout=180s
          kubectl rollout status daemonset/edge-device-discovery -n edgex-edge --timeout=240s
          kubectl rollout status daemonset/edge-device-discovery-i2c -n edgex-edge --timeout=240s
          kubectl rollout status deployment/device-serial-jetson -n edgex-edge --timeout=180s
          kubectl rollout status deployment/device-sensehat-raspi -n edgex-edge --timeout=180s

      - name: Deploy state-aggregator image through Argo CD
        if: steps.changes.outputs.state_aggregator == 'true'
        run: |
          test -n "${STATE_AGGREGATOR_IMAGE}"
          TARGET_REVISION=${{ github.sha }}
          kubectl patch application edge-orch-state-aggregator -n argocd --type=merge \
            -p "{\"spec\":{\"source\":{\"targetRevision\":\"${TARGET_REVISION}\",\"kustomize\":{\"images\":[\"${STATE_AGGREGATOR_IMAGE}\"]}}}}"
          kubectl annotate application edge-orch-state-aggregator -n argocd \
            argocd.argoproj.io/refresh=hard \
            --overwrite
          CURRENT_IMAGE=""
          for attempt in $(seq 1 60); do
            CURRENT_IMAGE=$(kubectl get deployment state-aggregator -n default -o jsonpath='{.spec.template.spec.containers[?(@.name=="state-aggregator")].image}')
            if [ "${CURRENT_IMAGE}" = "${STATE_AGGREGATOR_IMAGE}" ]; then
              break
            fi
            sleep 2
          done
          test "${CURRENT_IMAGE}" = "${STATE_AGGREGATOR_IMAGE}"
          kubectl rollout status deployment/state-aggregator -n default --timeout=180s

      - name: Deploy mqttvirtual mapper latest image
        if: steps.changes.outputs.mqttvirtual == 'true'
        run: |
          if ! kubectl get daemonset mqttvirtual-mapper -n default >/dev/null 2>&1; then
            echo "Legacy mqttvirtual mapper is not deployed; skipping rollout."
            exit 0
          fi

          CURRENT_IMAGE=$(kubectl get daemonset mqttvirtual-mapper -n default -o jsonpath='{.spec.template.spec.containers[?(@.name=="mqttvirtual")].image}')
          TARGET_IMAGE=${{ env.REGISTRY }}/mqttvirtual:latest

          kubectl set image daemonset/mqttvirtual-mapper \
            mqttvirtual=${TARGET_IMAGE} \
            -n default

          if [ "${CURRENT_IMAGE}" = "${TARGET_IMAGE}" ]; then
            kubectl rollout restart daemonset/mqttvirtual-mapper -n default
          fi

          kubectl rollout status daemonset/mqttvirtual-mapper -n default --timeout=180s

      # - name: Deploy Ollama qwen3 and edge-agent
      #   if: steps.changes.outputs.edge_agent == 'true'
      #   run: |
      #     kubectl label node etri-ser0002-cgnmsb agent-node=true --overwrite
      #     kubectl apply -f llm/ollama-qwen3.yaml
      #     kubectl apply -f llm/edge-agent/edge-agent-rbac.yaml
      #     kubectl apply -f llm/edge-agent/edge-agent.yaml

      #     CURRENT_IMAGE=$(kubectl get deployment edge-agent -n default -o jsonpath='{.spec.template.spec.containers[?(@.name=="edge-agent")].image}' 2>/dev/null || true)
      #     TARGET_IMAGE=${{ env.REGISTRY }}/edge-agent:latest

      #     kubectl set image deployment/edge-agent \
      #       edge-agent=${TARGET_IMAGE} \
      #       -n default

      #     if [ "${CURRENT_IMAGE}" = "${TARGET_IMAGE}" ]; then
      #       kubectl rollout restart deployment/edge-agent -n default
      #     fi

      #     kubectl rollout status deployment/ollama-qwen3 -n default --timeout=900s
      #     kubectl rollout status deployment/edge-agent -n default --timeout=180s
