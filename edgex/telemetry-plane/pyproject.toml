[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgex-telemetry-plane"
version = "0.1.0"
description = "Durable EdgeX telemetry forwarding and command bridge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "paho-mqtt>=2.1,<3",
  "psycopg[binary]>=3.1,<4",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
