            runAsGroup: 65534
        - name: wait-for-database-bootstrap
          image: postgres:16.3-alpine@sha256:36ed71227ae36305d26382657c0b96cbaf298427b3f1eaeb10d77a6dea3eec41
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              until test "$(psql -h edgex-postgres -d edgex_db -tAc
              "SELECT 1")" = 1;
              do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: password
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: username
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
      containers:
        - name: core-command
          image: edgexfoundry/core-command:4.0.2@sha256:0479d8bb2b977c63db4a1cbb810c6583879ccc5b63a4f555276e0c114862458e
          imagePullPolicy: IfNotPresent
          args:
            - --registry
            - -cp=keeper.http://edgex-core-keeper:59890
          env:
            - name: EDGEX_SECURITY_SECRET_STORE
              value: "false"
            - name: SERVICE_HOST
              value: edgex-core-command
          ports:
            - name: http
              containerPort: 59882
          startupProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2002
            runAsGroup: 2001
---
apiVersion: v1
