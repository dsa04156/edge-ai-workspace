apiVersion: v1
kind: Service
metadata:
  name: edgex-postgres
  labels:
    app.kubernetes.io/name: edgex-postgres
    app.kubernetes.io/part-of: edgex-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edgex-postgres
  labels:
    app.kubernetes.io/name: edgex-postgres
    app.kubernetes.io/part-of: edgex-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: edgex-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-postgres
        app.kubernetes.io/part-of: edgex-system
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-postgres-volumes
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - /bin/sh
            - -c
            - >-
              chown 70:70 /var/lib/postgresql/data /var/run/postgresql &&
              chmod 0700 /var/lib/postgresql/data &&
              chmod 0775 /var/run/postgresql
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      containers:
        - name: postgres
          image: postgres:16.3-alpine@sha256:36ed71227ae36305d26382657c0b96cbaf298427b3f1eaeb10d77a6dea3eec41
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: edgex_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  pg_isready -U "$POSTGRES_USER" -d edgex_db &&
                  test "$(psql -U "$POSTGRES_USER" -d edgex_db -tAc
                  "SELECT 1")" = 1
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  pg_isready -U "$POSTGRES_USER" -d edgex_db &&
                  test "$(psql -U "$POSTGRES_USER" -d edgex_db -tAc
                  "SELECT 1")" = 1
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d edgex_db
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: edgex-postgres
          app.kubernetes.io/part-of: edgex-system
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
