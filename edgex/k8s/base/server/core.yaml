kind: Namespace
metadata:
  name: edgex-system
  labels:
    app.kubernetes.io/part-of: edgex-system
---
apiVersion: v1
kind: Service
metadata:
  name: edgex-core-keeper
  labels:
    app.kubernetes.io/name: edgex-core-keeper
    app.kubernetes.io/part-of: edgex-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-core-keeper
  ports:
    - name: http
      port: 59890
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-core-keeper
  labels:
    app.kubernetes.io/name: edgex-core-keeper
    app.kubernetes.io/part-of: edgex-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-core-keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-core-keeper
        app.kubernetes.io/part-of: edgex-system
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2001
      initContainers:
        - name: wait-for-infrastructure
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - /bin/sh
            - -c
            - >-
              until nc -z edgex-postgres 5432 && nc -z edgex-messagebus 1883;
              do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
        - name: wait-for-database-bootstrap
          image: postgres:16.3-alpine@sha256:36ed71227ae36305d26382657c0b96cbaf298427b3f1eaeb10d77a6dea3eec41
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              until test "$(psql -h edgex-postgres -d edgex_db -tAc
              "SELECT 1")" = 1;
              do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: password
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: username
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
        - name: generate-database-config
          image: edgexfoundry/core-keeper:4.0.2@sha256:49e87a003796dae20c5be64b0b4ea671e28c78a9c1a299ddb30e59824d544f40
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              tmp=/generated/.configuration.yaml.$$
              trap 'rm -f "$tmp"' 0 HUP INT TERM
              awk '
                function yaml_scalar(value, escaped, position, character) {
                  if (value == "" || value ~ /[[:cntrl:]]/) {
                    invalid = 1
                    return ""
                  }
                  for (position = 1; position <= length(value); position++) {
                    character = substr(value, position, 1)
                    if (character == "\\") escaped = escaped "\\" "\\"
                    else if (character == "\"") escaped = escaped "\\" "\""
                    else escaped = escaped character
                  }
                  return "\"" escaped "\""
                }
                BEGIN {
                  username = yaml_scalar(ENVIRON["DB_USERNAME"])
                  password = yaml_scalar(ENVIRON["DB_PASSWORD"])
                  if (invalid) exit 2
                }
                $0 == "    DB:" {
                  db_sections++
                  in_db = 1
                  print
                  next
                }
                in_db && $0 == "Service:" {
                  if (in_secret) secret_ends++
                  db_ends++
                  in_db = 0
                  in_secret = 0
                  print
                  next
                }
                in_db && $0 == "      SecretData:" {
                  secret_sections++
                  in_secret = 1
                  print
                  next
                }
                in_secret && $0 ~ /^      [^ ]/ {
                  in_secret = 0
                }
                in_secret && $0 == "        username: \"postgres\"" {
                  usernames++
                  print "        username: " username
                  next
                }
                in_secret && $0 == "        password: \"postgres\"" {
                  passwords++
                  print "        password: " password
                  next
                }
                { print }
                END {
                  if (invalid || db_sections != 1 || db_ends != 1 ||
                      secret_sections != 1 || secret_ends != 1 ||
                      usernames != 1 || passwords != 1) exit 1
                }
              ' /res/configuration.yaml > "$tmp"
              chmod 0600 "$tmp"
              mv "$tmp" /generated/configuration.yaml
              trap - 0 HUP INT TERM
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: password
          volumeMounts:
            - name: generated-config
              mountPath: /generated
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2002
            runAsGroup: 2001
      containers:
        - name: core-keeper
          image: edgexfoundry/core-keeper:4.0.2@sha256:49e87a003796dae20c5be64b0b4ea671e28c78a9c1a299ddb30e59824d544f40
          imagePullPolicy: IfNotPresent
          args:
            - -cd=/generated
          env:
            - name: DATABASE_HOST
              value: edgex-postgres
            - name: EDGEX_SECURITY_SECRET_STORE
              value: "false"
            - name: MESSAGEBUS_AUTHMODE
              value: none
            - name: MESSAGEBUS_HOST
              value: edgex-messagebus
            - name: MESSAGEBUS_PORT
              value: "1883"
            - name: MESSAGEBUS_PROTOCOL
              value: tcp
            - name: MESSAGEBUS_SECRETNAME
              value: ""
            - name: MESSAGEBUS_TYPE
              value: mqtt
            - name: SERVICE_HOST
              value: edgex-core-keeper
            - name: SERVICE_SERVERBINDADDR
              value: 0.0.0.0
          volumeMounts:
            - name: generated-config
              mountPath: /generated
              readOnly: true
          ports:
            - name: http
              containerPort: 59890
          startupProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2002
            runAsGroup: 2001
      volumes:
        - name: generated-config
          emptyDir: {}
---
