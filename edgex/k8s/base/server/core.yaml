apiVersion: v1
kind: Service
metadata:
  name: edgex-messagebus
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgex-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-messagebus
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-messagebus
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgex-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-messagebus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-messagebus
        app.kubernetes.io/part-of: edgex-system
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
          imagePullPolicy: IfNotPresent
          args:
            - /usr/sbin/mosquitto
