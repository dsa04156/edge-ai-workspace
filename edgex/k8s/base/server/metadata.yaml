apiVersion: batch/v1
kind: Job
metadata:
  name: edgex-metadata-bootstrap
  labels:
    app.kubernetes.io/name: edgex-metadata-bootstrap
    app.kubernetes.io/part-of: edgex-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "4"
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-metadata-bootstrap
        app.kubernetes.io/part-of: edgex-system
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-core-metadata
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              until nc -z edgex-core-metadata 59881; do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: metadata-bootstrap
          image: 192.168.0.56:5000/edgex-ingest-gateway:direct-v2-amd64-20260720@sha256:bdc3a0808eacb06b85f68fd4c3320f39e1fc6648bb64a9fccd7ba96e67ea4a71
          imagePullPolicy: IfNotPresent
          command: [python, -m, telemetry_plane.metadata_bootstrap]
          args:
            - --metadata-url
            - http://edgex-core-metadata:59881
            - --contract
            - /config/metadata-contract.json
            - --messagebus-host
            - edgex-messagebus
            - --messagebus-port
            - "1883"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: metadata-contract
              mountPath: /config
              readOnly: true
      volumes:
        - name: metadata-contract
          configMap:
            name: edgex-metadata-contract
