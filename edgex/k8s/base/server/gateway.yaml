apiVersion: v1
kind: ConfigMap
metadata:
  name: edgex-gateway-contract
  labels:
    app.kubernetes.io/name: edgex-ingest-gateway
    app.kubernetes.io/part-of: edgex-system
data:
  CORE_DATA_URL: http://edgex-core-data.edgex-system.svc:59880
  CORE_DATA_SERVICE_NAME: edgex-ingest-gateway
  TELEMETRY_PORT: "8443"
  COMMAND_ENABLED: "false"
  COMMAND_MAX_TTL_SECONDS: "30"
  COMMAND_TIMEOUT_SECONDS: "10"
---
apiVersion: v1
kind: Service
metadata:
  name: edgex-ingest-gateway
  labels:
    app.kubernetes.io/name: edgex-ingest-gateway
    app.kubernetes.io/part-of: edgex-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-ingest-gateway
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-ingest-gateway
  labels:
    app.kubernetes.io/name: edgex-ingest-gateway
    app.kubernetes.io/part-of: edgex-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-ingest-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-ingest-gateway
        app.kubernetes.io/part-of: edgex-system
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-core-data
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              until nc -z edgex-core-data.edgex-system.svc 59880;
              do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: gateway
          image: 192.168.0.56:5000/edgex-ingest-gateway:direct-v2-amd64-20260720@sha256:bdc3a0808eacb06b85f68fd4c3320f39e1fc6648bb64a9fccd7ba96e67ea4a71
          imagePullPolicy: IfNotPresent
          command: [python, -m, telemetry_plane.main]
          ports:
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: edgex-gateway-contract
          env:
            - name: TELEMETRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edgex-telemetry-plane-credentials
                  key: database-url
            - name: TELEMETRY_EDGE_AUTH_SECRETS_JSON
              valueFrom:
                secretKeyRef:
                  name: edgex-telemetry-edge-auth
                  key: edge-auth-secrets.json
            - name: TELEMETRY_TLS_CA_FILE
              value: /run/gateway-tls/ca.crt
            - name: TELEMETRY_TLS_CERT_FILE
              value: /run/gateway-tls/tls.crt
            - name: TELEMETRY_TLS_KEY_FILE
              value: /run/gateway-tls/tls.key
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: gateway-tls
              mountPath: /run/gateway-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: gateway-tls
          secret:
            secretName: edgex-ingest-gateway-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgex-system-default-deny-ingress
  labels:
    app.kubernetes.io/part-of: edgex-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgex-system-internal-ingress
  labels:
    app.kubernetes.io/part-of: edgex-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edgex-system
