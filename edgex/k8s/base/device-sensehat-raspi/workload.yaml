apiVersion: v1
kind: Service
metadata:
  name: device-sensehat-raspi
  labels:
    app.kubernetes.io/name: device-sensehat-raspi
    app.kubernetes.io/part-of: edgex-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: device-sensehat-raspi
  ports:
    - name: http
      port: 59911
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-sensehat-raspi
  labels:
    app.kubernetes.io/name: device-sensehat-raspi
    app.kubernetes.io/part-of: edgex-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: device-sensehat-raspi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-sensehat-raspi
        app.kubernetes.io/part-of: edgex-system
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-dev0003-raspi5
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-sensehat-raspi
          image: 192.168.0.56:5000/edgex-device-sensehat@sha256:13c7b672110362d4907b797ccae50aad67d968da2296783295509f99c82b836c
          imagePullPolicy: IfNotPresent
          args:
            - -cp=keeper.http://edgex-core-keeper.edgex-system.svc.cluster.local:59890
            - -cd=/res
          env:
            - name: EDGEX_SECURITY_SECRET_STORE
              value: "false"
            - name: SERVICE_HOST
              value: device-sensehat-raspi.edgex-edge.svc.cluster.local
            - name: SERVICE_SERVERBINDADDR
              value: 0.0.0.0
            - name: CLIENTS_CORE_METADATA_HOST
              value: edgex-core-metadata.edgex-system.svc.cluster.local
            - name: MESSAGEBUS_HOST
              value: edgex-messagebus.edgex-system.svc.cluster.local
          ports:
            - name: http
              containerPort: 59911
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 750m
              memory: 384Mi
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: service-config
              mountPath: /res
              readOnly: true
            - name: sensehat-i2c
              mountPath: /dev/i2c-1
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: service-config
          configMap:
            name: device-sensehat-raspi-config
            items:
              - key: configuration.yaml
                path: configuration.yaml
              - key: etri-sensehat-temperature.yaml
                path: profiles/etri-sensehat-temperature.yaml
              - key: etri-sensehat-humidity.yaml
                path: profiles/etri-sensehat-humidity.yaml
              - key: etri-sensehat-pressure.yaml
                path: profiles/etri-sensehat-pressure.yaml
              - key: etri-sensehat-compass.yaml
                path: profiles/etri-sensehat-compass.yaml
              - key: etri-sensehat-orientation.yaml
                path: profiles/etri-sensehat-orientation.yaml
              - key: etri-sensehat-gyroscope.yaml
                path: profiles/etri-sensehat-gyroscope.yaml
              - key: sensehat-virtual-devices.yaml
                path: devices/sensehat-virtual-devices.yaml
        - name: sensehat-i2c
          hostPath:
            path: /dev/i2c-1
            type: CharDevice
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-sensehat-raspi-egress
  labels:
    app.kubernetes.io/name: device-sensehat-raspi
    app.kubernetes.io/part-of: edgex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device-sensehat-raspi
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edgex-system
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [edgex-core-keeper, edgex-core-metadata, edgex-messagebus]
      ports:
        - {protocol: TCP, port: 59890}
        - {protocol: TCP, port: 59881}
        - {protocol: TCP, port: 1883}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-sensehat-raspi-ingress
  labels:
    app.kubernetes.io/name: device-sensehat-raspi
    app.kubernetes.io/part-of: edgex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device-sensehat-raspi
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edgex-system
      ports:
        - {protocol: TCP, port: 59911}
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              edge-ai.io/local-data-client: "true"
      ports:
        - {protocol: TCP, port: 59911}
