deviceList:
  - name: virtual-temperature-001
    profileName: etri-arduino-temperature
    description: Virtual temperature device backed by Arduino Uno on the Jetson edge node
    labels: [arduino, serial, jetson, virtual-device]
    tags:
      physicalDeviceId: arduino-001
      nodeName: etri-dev0001-jetorn
    protocols:
      serial:
        Port: /dev/edgeai/arduino-001
        BaudRate: "115200"
        DeviceID: arduino-001
        RecoveryStrategy: on-demand-read
        ResourceName: temperature_raw
