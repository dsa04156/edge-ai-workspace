apiVersion: v1
kind: Service
metadata:
  name: edge-modbus-simulator
  labels:
    app.kubernetes.io/name: edge-modbus-simulator
    app.kubernetes.io/part-of: edgex-system
    app.kubernetes.io/component: development-fixture
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edge-modbus-simulator
  ports:
    - name: modbus-tcp
      port: 1502
      targetPort: modbus-tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-modbus-simulator
  labels:
    app.kubernetes.io/name: edge-modbus-simulator
    app.kubernetes.io/part-of: edgex-system
    app.kubernetes.io/component: development-fixture
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-modbus-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-modbus-simulator
        app.kubernetes.io/part-of: edgex-system
        app.kubernetes.io/component: development-fixture
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: docker.io/library/python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/server.py
          env:
            - name: MODBUS_LISTEN_PORT
              value: "1502"
            - name: MODBUS_UNIT_IDS
              value: "1,2,3"
          ports:
            - name: modbus-tcp
              containerPort: 1502
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: modbus-tcp
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: modbus-tcp
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: modbus-tcp
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: simulator-code
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: simulator-code
          configMap:
            name: edge-modbus-simulator-code
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-modbus-simulator
  labels:
    app.kubernetes.io/name: edge-modbus-simulator
    app.kubernetes.io/part-of: edgex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge-modbus-simulator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              edgeai.etri.re.kr/adapter: modbus
      ports:
        - protocol: TCP
          port: 1502
