apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-adapter-controller
  labels:
    app.kubernetes.io/name: edgex-adapter-controller
    app.kubernetes.io/part-of: edgex-system
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-adapter-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-adapter-controller
        app.kubernetes.io/part-of: edgex-system
    spec:
      serviceAccountName: edgex-adapter-controller
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edgex-adapter-controller
          image: 192.168.0.56:5000/edge-adapter-controller@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ADAPTER_CONTROLLER_NAMESPACE
              value: edgex-edge
            - name: ADAPTER_RUNTIME_CATALOG_PATH
              value: /app/config/runtime_templates.json
            - name: ADAPTER_RUNTIME_MUTATION_ENABLED
              value: "true"
            - name: ADAPTER_CONTROLLER_INTERNAL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: edgex-adapter-management-auth
                  key: internal-hmac-key
            - name: EDGEX_CORE_METADATA_URL
              value: http://edgex-core-metadata.edgex-system.svc.cluster.local:59881
            - name: EDGEX_TIMEOUT_SECONDS
              value: "5"
            - name: ADAPTER_CONTROLLER_RECONCILE_INTERVAL_SECONDS
              value: "10"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2001
            runAsGroup: 2001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edgex-adapter-controller
  labels:
    app.kubernetes.io/name: edgex-adapter-controller
    app.kubernetes.io/part-of: edgex-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-adapter-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
