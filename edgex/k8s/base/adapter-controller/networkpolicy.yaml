apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgex-adapter-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edgex-adapter-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: state-aggregator
      ports:
        - protocol: TCP
          port: 8080
