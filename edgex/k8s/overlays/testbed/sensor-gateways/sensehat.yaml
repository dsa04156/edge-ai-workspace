apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edgex-edge-agent-sensehat-outbox
  labels:
    app.kubernetes.io/component: telemetry-edge-agent
    app.kubernetes.io/name: edge-telemetry-agent
    app.kubernetes.io/instance: edgex-edge-agent-sensehat
    app.kubernetes.io/part-of: edgex-telemetry-edge
    edge.etri.io/id: etri-dev0003-raspi5
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-edge-agent-sensehat
  labels:
    app.kubernetes.io/component: telemetry-edge-agent
    app.kubernetes.io/name: edge-telemetry-agent
    app.kubernetes.io/instance: edgex-edge-agent-sensehat
    app.kubernetes.io/part-of: edgex-telemetry-edge
    edge.etri.io/id: etri-dev0003-raspi5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: telemetry-edge-agent
      app.kubernetes.io/name: edge-telemetry-agent
      app.kubernetes.io/instance: edgex-edge-agent-sensehat
      app.kubernetes.io/part-of: edgex-telemetry-edge
      edge.etri.io/id: etri-dev0003-raspi5
  template:
    metadata:
      labels:
        app.kubernetes.io/component: telemetry-edge-agent
        app.kubernetes.io/name: edge-telemetry-agent
        app.kubernetes.io/instance: edgex-edge-agent-sensehat
        app.kubernetes.io/part-of: edgex-telemetry-edge
        edge.etri.io/id: etri-dev0003-raspi5
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: etri-dev0003-raspi5
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry-edge-agent
          image: 192.168.0.56:5000/edgex-telemetry-plane:direct-v1-arm64-20260720@sha256:c91842bb9431ff7c5ef03fe74f65bf9d1932b44e747682de93dec0ae5080fbac
          imagePullPolicy: IfNotPresent
          command: [python, -m, telemetry_plane.edge]
          ports:
            - name: https
              containerPort: 8443
            - name: adapter
              containerPort: 18080
          envFrom:
            - configMapRef:
                name: edgex-edge-agent-contract
          env:
            - name: EDGE_ID
              value: etri-dev0003-raspi5
            - name: EDGE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: edgex-edge-agent-sensehat-credentials
                  key: edge-auth-secret
            - name: TELEMETRY_SOURCE_MODE
              value: direct
            - name: TELEMETRY_TLS_CA_FILE
              value: /run/gateway-mtls/ca.crt
            - name: TELEMETRY_TLS_CERT_FILE
              value: /run/gateway-mtls/tls.crt
            - name: TELEMETRY_TLS_KEY_FILE
              value: /run/gateway-mtls/tls.key
          startupProbe:
            tcpSocket: { port: https }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: { port: https }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: https }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: outbox
              mountPath: /var/lib/edgex/outbox
            - name: tmp
              mountPath: /tmp
            - name: gateway-mtls
              mountPath: /run/gateway-mtls
              readOnly: true
      volumes:
        - name: outbox
          persistentVolumeClaim:
            claimName: edgex-edge-agent-sensehat-outbox
        - name: tmp
          emptyDir: {}
        - name: gateway-mtls
          secret:
            secretName: edgex-edge-agent-sensehat-gateway-mtls
