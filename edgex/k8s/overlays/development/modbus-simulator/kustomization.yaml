apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/modbus-simulator

patches:
  - target:
      kind: Deployment
      name: edge-modbus-simulator
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
