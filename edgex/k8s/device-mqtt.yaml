apiVersion: v1
kind: Service
metadata:
  name: edgex-device-mqtt
  labels:
    app.kubernetes.io/name: edgex-device-mqtt
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-device-mqtt
  ports:
    - name: http
      port: 59982
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-device-mqtt
  labels:
    app.kubernetes.io/name: edgex-device-mqtt
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-device-mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-device-mqtt
        app.kubernetes.io/part-of: edgex-telemetry
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: etri-dev0001-jetorn
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-mqtt
          image: edgexfoundry/device-mqtt-arm64:4.0.2
          imagePullPolicy: IfNotPresent
          args:
            - -cp=keeper.http://edgex-core-keeper:59890
            - --registry
          env:
            - name: EDGEX_SECURITY_SECRET_STORE
              value: "false"
            - name: SERVICE_HOST
              value: edgex-device-mqtt
            - name: SERVICE_SERVERBINDADDR
              value: 0.0.0.0
            - name: DEVICE_PROFILESDIR
              value: /res/profiles
            - name: DEVICE_DEVICESDIR
              value: /res/devices
            - name: MQTTBROKERINFO_SCHEMA
              value: tcp
            - name: MQTTBROKERINFO_HOST
              value: 127.0.0.1
            - name: MQTTBROKERINFO_PORT
              value: "1883"
            - name: MQTTBROKERINFO_AUTHMODE
              value: none
            - name: MQTTBROKERINFO_INCOMINGTOPIC
              value: etri/etri-dev0001-jetorn/#
          ports:
            - name: http
              containerPort: 59982
          startupProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2002
            runAsGroup: 2001
          volumeMounts:
            - name: profiles
              mountPath: /res/profiles
              readOnly: true
            - name: devices
              mountPath: /res/devices
              readOnly: true
      volumes:
        - name: profiles
          configMap:
            name: edgex-device-mqtt-profiles
        - name: devices
          configMap:
            name: edgex-device-mqtt-devices
---
