apiVersion: v1
kind: Secret
metadata:
  name: edgex-postgres-credentials
  labels:
    app.kubernetes.io/part-of: edgex-telemetry
type: Opaque
stringData:
  password: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: edgex-postgres
  labels:
    app.kubernetes.io/name: edgex-postgres
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edgex-postgres
  labels:
    app.kubernetes.io/name: edgex-postgres
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  serviceName: edgex-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-postgres
        app.kubernetes.io/part-of: edgex-telemetry
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.3-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: edgex_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgex-postgres-credentials
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d edgex_db
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d edgex_db
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d edgex_db
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: edgex-postgres
          app.kubernetes.io/part-of: edgex-telemetry
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
