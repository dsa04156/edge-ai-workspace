apiVersion: v1
kind: ConfigMap
metadata:
  name: edgex-messagebus-config
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgex-telemetry
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence false
---
apiVersion: v1
kind: Service
metadata:
  name: edgex-messagebus
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-messagebus
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-messagebus
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-messagebus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-messagebus
        app.kubernetes.io/part-of: edgex-telemetry
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          imagePullPolicy: IfNotPresent
          args:
            - /usr/sbin/mosquitto
            - -c
            - /mosquitto/config/mosquitto.conf
          ports:
            - name: mqtt
              containerPort: 1883
          startupProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2002
            runAsGroup: 2001
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edgex-messagebus-config
