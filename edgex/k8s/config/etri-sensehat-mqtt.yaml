name: etri-sensehat-mqtt
manufacturer: Raspberry Pi
model: Sense-HAT
labels:
  - mqtt
  - sensehat
  - etri-poc
description: Read-only Sense HAT telemetry received through EdgeX Device MQTT
deviceResources:
  - name: temp_humidity
    isHidden: false
    description: Temperature derived from the humidity sensor
    properties:
      valueType: Float64
      readWrite: R
  - name: temp_pressure
    isHidden: false
    description: Temperature derived from the pressure sensor
    properties:
      valueType: Float64
      readWrite: R
  - name: humidity
    isHidden: false
    description: Relative humidity percentage
    properties:
      valueType: Float64
      readWrite: R
  - name: pressure
    isHidden: false
    description: Atmospheric pressure in millibars
    properties:
      valueType: Float64
      readWrite: R
  - name: compass
    isHidden: false
    description: Compass heading in degrees
    properties:
      valueType: Float64
      readWrite: R
  - name: pitch
    isHidden: false
    description: Orientation pitch in degrees
    properties:
      valueType: Float64
      readWrite: R
  - name: roll
    isHidden: false
    description: Orientation roll in degrees
    properties:
      valueType: Float64
      readWrite: R
  - name: yaw
    isHidden: false
    description: Orientation yaw in degrees
    properties:
      valueType: Float64
      readWrite: R
  - name: gyro_x
    isHidden: false
    description: Gyroscope angular velocity on the x axis
    properties:
      valueType: Float64
      readWrite: R
  - name: gyro_y
    isHidden: false
    description: Gyroscope angular velocity on the y axis
    properties:
      valueType: Float64
      readWrite: R
  - name: gyro_z
    isHidden: false
    description: Gyroscope angular velocity on the z axis
    properties:
      valueType: Float64
      readWrite: R
deviceCommands:
  - name: temperature
    isHidden: false
    readWrite: R
    resourceOperations:
      - deviceResource: temp_humidity
      - deviceResource: temp_pressure
  - name: humidity
    isHidden: false
    readWrite: R
    resourceOperations:
      - deviceResource: humidity
  - name: pressure
    isHidden: false
    readWrite: R
    resourceOperations:
      - deviceResource: pressure
  - name: compass
    isHidden: false
    readWrite: R
    resourceOperations:
      - deviceResource: compass
  - name: orientation
    isHidden: false
    readWrite: R
    resourceOperations:
      - deviceResource: pitch
      - deviceResource: roll
      - deviceResource: yaw
  - name: gyroscope
    isHidden: false
    readWrite: R
    resourceOperations:
      - deviceResource: gyro_x
      - deviceResource: gyro_y
      - deviceResource: gyro_z
