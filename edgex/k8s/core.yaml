apiVersion: v1
kind: Service
metadata:
  name: edgex-core-keeper
  labels:
    app.kubernetes.io/name: edgex-core-keeper
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edgex-core-keeper
  ports:
    - name: http
      port: 59890
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgex-core-keeper
  labels:
    app.kubernetes.io/name: edgex-core-keeper
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-core-keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-core-keeper
        app.kubernetes.io/part-of: edgex-telemetry
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-infrastructure
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - >-
              until nc -z edgex-postgres 5432 && nc -z edgex-messagebus 1883;
              do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: core-keeper
          image: edgexfoundry/core-keeper:4.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_HOST
              value: edgex-postgres
            - name: EDGEX_SECURITY_SECRET_STORE
              value: "false"
            - name: MESSAGEBUS_AUTHMODE
              value: none
            - name: MESSAGEBUS_HOST
              value: edgex-messagebus
            - name: MESSAGEBUS_PORT
              value: "1883"
            - name: MESSAGEBUS_PROTOCOL
              value: tcp
            - name: MESSAGEBUS_SECRETNAME
              value: ""
            - name: MESSAGEBUS_TYPE
              value: mqtt
            - name: SERVICE_HOST
              value: edgex-core-keeper
            - name: SERVICE_SERVERBINDADDR
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 59890
          startupProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v3/ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2002
            runAsGroup: 2001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: edgex-core-common-config-bootstrapper
  labels:
    app.kubernetes.io/name: edgex-core-common-config-bootstrapper
    app.kubernetes.io/part-of: edgex-telemetry
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-core-common-config-bootstrapper
        app.kubernetes.io/part-of: edgex-telemetry
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-core-keeper
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - >-
              until nc -z edgex-core-keeper 59890; do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: core-common-config-bootstrapper
          image: edgexfoundry/core-common-config-bootstrapper:4.0.2
          imagePullPolicy: IfNotPresent
          command:
            - /core-common-config-bootstrapper
          args:
            - --registry
            - -cp=keeper.http://edgex-core-keeper:59890
          env:
            - name: ALL_SERVICES_DATABASE_HOST
              value: edgex-postgres
            - name: ALL_SERVICES_MESSAGEBUS_HOST
              value: edgex-messagebus
            - name: ALL_SERVICES_REGISTRY_HOST
              value: edgex-core-keeper
            - name: ALL_SERVICES_SERVICE_SERVERBINDADDR
              value: 0.0.0.0
            - name: APP_SERVICES_CLIENTS_CORE_METADATA_HOST
              value: edgex-core-metadata
            - name: DEVICE_SERVICES_CLIENTS_CORE_METADATA_HOST
              value: edgex-core-metadata
            - name: EDGEX_SECURITY_SECRET_STORE
              value: "false"
            - name: EDGEX_OVERWRITE_CONFIG
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2002
            runAsGroup: 2001
---
