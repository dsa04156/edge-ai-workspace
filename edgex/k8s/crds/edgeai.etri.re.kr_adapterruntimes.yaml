apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: adapterruntimes.edgeai.etri.re.kr
spec:
  group: edgeai.etri.re.kr
  scope: Namespaced
  names:
    plural: adapterruntimes
    singular: adapterruntime
    kind: AdapterRuntime
    shortNames:
      - aruntime
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Adapter
          type: string
          jsonPath: .spec.adapterId
        - name: Node
          type: string
          jsonPath: .spec.targetNode
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Consumers
          type: integer
          jsonPath: .status.consumers
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - templateId
                - adapterId
                - targetNode
                - hardwareBindingId
                - edgeX
                - desiredState
                - requestRef
              properties:
                templateId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                adapterId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                targetNode:
                  type: string
                  minLength: 1
                  maxLength: 253
                hardwareBindingId:
                  type: string
                  minLength: 1
                  maxLength: 128
                edgeX:
                  type: object
                  required:
                    - serviceName
                    - messageBusHost
                    - messageBusPort
                  properties:
                    serviceName:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                    messageBusHost:
                      type: string
                      enum:
                        - edgex-messagebus.edgex-system.svc.cluster.local
                    messageBusPort:
                      type: integer
                      enum:
                        - 1883
                desiredState:
                  type: string
                  enum:
                    - Running
                    - Retired
                restartNonce:
                  type: string
                  maxLength: 128
                  default: ""
                requestRef:
                  type: object
                  required:
                    - requestId
                    - payloadHash
                    - planHash
                  properties:
                    requestId:
                      type: string
                      pattern: ^[0-9a-f]{64}$
                    payloadHash:
                      type: string
                      pattern: ^[0-9a-f]{64}$
                    planHash:
                      type: string
                      pattern: ^[0-9a-f]{64}$
                actionRef:
                  type: object
                  required:
                    - action
                    - requestId
                    - payloadHash
                  properties:
                    action:
                      type: string
                      enum:
                        - restart
                        - retire
                    requestId:
                      type: string
                      pattern: ^[0-9a-f]{64}$
                    payloadHash:
                      type: string
                      pattern: ^[0-9a-f]{64}$
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - PLANNED
                    - DEPLOYING
                    - WORKLOAD_READY
                    - SERVICE_READY
                    - RESTARTING
                    - FAILED
                    - RETIRING
                    - RETIRED
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                managementMode:
                  type: string
                  enum:
                    - controller
                workloadRef:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                serviceRef:
                  type: object
                  properties:
                    name:
                      type: string
                edgeXServiceObserved:
                  type: boolean
                consumers:
                  type: integer
                  minimum: 0
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                lastTransitionTime:
                  type: string
                  format: date-time
                lastError:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                      maxLength: 1000
