Writable:
  LogLevel: INFO
  Reading:
    ReadingUnits: true
  Telemetry:
    Metrics:
      LocalDataCacheSamples: true
      LocalDataCacheSeries: true
      LocalDataCacheAllocatedBytes: true
      LocalDataCacheEvictions: true

Service:
  Host: localhost
  Port: 59910
  StartupMsg: Jetson Arduino serial Device Service started

Clients:
  core-metadata:
    Host: edgex-core-metadata

MessageBus:
  Host: edgex-messagebus
  Optional:
    ClientId: device-serial-jetson

Driver:
  LocalDataCacheMaxAge: "10m"
  LocalDataCacheMaxSamplesPerSeries: "10000"
  LocalDataCacheMaxBytes: "67108864"

MaxConcurrentCommands: 16

Device:
  AsyncBufferSize: 16
  ProfilesDir: /res/profiles
  DevicesDir: /res/devices
  Discovery:
    Enabled: false
    Interval: 30s
  AutoEvents:
    SendChangedReadingsOnly: false
