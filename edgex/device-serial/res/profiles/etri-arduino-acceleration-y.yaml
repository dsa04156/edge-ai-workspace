apiVersion: "v2"
name: etri-arduino-acceleration-y
manufacturer: Arduino
model: Uno virtual acceleration Y source
labels:
  - arduino
  - serial
  - jetson
  - virtual-device
description: Read-only virtual acceleration Y device sourced from the Jetson Arduino serial connection

deviceResources:
  - name: acceleration_y_raw
    description: Raw acceleration Y-axis value
    properties:
      valueType: Int32
      readWrite: R
      units: raw

deviceCommands:
  - name: acceleration_y
    readWrite: R
    resourceOperations:
      - deviceResource: acceleration_y_raw
