{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "llama-spark-cache"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "storageClassName": "local-path",
        "resources": {
          "requests": {
            "storage": "8Gi"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "llama-spark"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "llama-spark"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "llama-spark"
            }
          },
          "spec": {
            "nodeSelector": {
              "kubernetes.io/hostname": "etri-ser0003-cg0ms0"
            },
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 150,
            "containers": [
              {
                "name": "api",
                "image": "docker.io/library/python@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254",
                "command": [
                  "python",
                  "/app/worker.py"
                ],
                "env": [
                  {
                    "name": "NODE_ID",
                    "value": "etri-ser0003-cg0ms0"
                  },
                  {
                    "name": "ROLE",
                    "value": "server"
                  },
                  {
                    "name": "PORT",
                    "value": "18110"
                  },
                  {
                    "name": "OLLAMA_URL",
                    "value": "http://127.0.0.1:11435"
                  },
                  {
                    "name": "PYTHONDONTWRITEBYTECODE",
                    "value": "1"
                  },
                  {
                    "name": "MAX_CONCURRENCY",
                    "value": "1"
                  }
                ],
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 18110
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 65532,
                  "runAsGroup": 65532,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "volumeMounts": [
                  {
                    "name": "code",
                    "mountPath": "/app",
                    "readOnly": true
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": "http"
                  },
                  "periodSeconds": 5,
                  "timeoutSeconds": 5
                }
              },
              {
                "name": "inference-runtime",
                "image": "docker.io/ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2",
                "command": [
                  "/bin/ollama",
                  "serve"
                ],
                "env": [
                  {
                    "name": "OLLAMA_HOST",
                    "value": "127.0.0.1:11435"
                  },
                  {
                    "name": "OLLAMA_MODELS",
                    "value": "/models"
                  },
                  {
                    "name": "OLLAMA_NUM_PARALLEL",
                    "value": "1"
                  },
                  {
                    "name": "OLLAMA_MAX_LOADED_MODELS",
                    "value": "1"
                  },
                  {
                    "name": "OLLAMA_KEEP_ALIVE",
                    "value": "-1"
                  },
                  {
                    "name": "OLLAMA_KV_CACHE_TYPE",
                    "value": "q8_0"
                  },
                  {
                    "name": "NVIDIA_DRIVER_CAPABILITIES",
                    "value": "compute,utility"
                  },
                  {
                    "name": "HOME",
                    "value": "/home/ollama"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "256Mi",
                    "nvidia.com/gpu": 1
                  },
                  "limits": {
                    "cpu": "6",
                    "memory": "8Gi",
                    "nvidia.com/gpu": 1
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 65532,
                  "runAsGroup": 65532,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "volumeMounts": [
                  {
                    "name": "model-cache",
                    "mountPath": "/models"
                  },
                  {
                    "name": "runtime-home",
                    "mountPath": "/home/ollama"
                  }
                ],
                "imagePullPolicy": "IfNotPresent"
              }
            ],
            "volumes": [
              {
                "name": "code",
                "configMap": {
                  "name": "spark-continuity-worker-code"
                }
              },
              {
                "name": "model-cache",
                "persistentVolumeClaim": {
                  "claimName": "llama-spark-cache"
                }
              },
              {
                "name": "runtime-home",
                "emptyDir": {}
              }
            ],
            "securityContext": {
              "fsGroup": 65532,
              "fsGroupChangePolicy": "OnRootMismatch"
            },
            "runtimeClassName": "nvidia-spark"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "llama-spark"
      },
      "spec": {
        "selector": {
          "app": "llama-spark"
        },
        "ports": [
          {
            "name": "http",
            "port": 18110,
            "targetPort": "http"
          }
        ]
      }
    }
  ]
}
