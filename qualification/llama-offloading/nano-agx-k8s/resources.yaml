      "metadata": {
        "name": "llama-continuity-test"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "llama-nano"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "llama-nano"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "llama-nano"
            }
          },
          "spec": {
            "nodeSelector": {
              "kubernetes.io/hostname": "etri-dev0001-jetorn"
            },
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 150,
            "containers": [
              {
                "name": "api",
                "image": "docker.io/library/python@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254",
                "command": [
                  "python",
                  "/app/worker.py"
                ],
                "env": [
                  {
                    "name": "NODE_ID",
                    "value": "etri-dev0001-jetorn"
                  },
                  {
                    "name": "ROLE",
                    "value": "nano"
                  },
                  {
                    "name": "PORT",
                    "value": "18110"
                  },
                  {
                    "name": "OLLAMA_URL",
                    "value": "http://127.0.0.1:11435"
                  },
                  {
                    "name": "PYTHONDONTWRITEBYTECODE",
                    "value": "1"
                  },
                  {
                    "name": "MAX_CONCURRENCY",
                    "value": "1"
                  },
                  {
                    "name": "CONTINUITY_SOURCE",
                    "value": "1"
                  }
                ],
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 18110
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 65532,
                  "runAsGroup": 65532,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "volumeMounts": [
                  {
                    "name": "code",
                    "mountPath": "/app",
                    "readOnly": true
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": "http"
                  },
                  "periodSeconds": 5,
                  "timeoutSeconds": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "code",
                "configMap": {
                  "name": "continuity-worker-code"
                }
              }
            ],
            "hostNetwork": true,
            "dnsPolicy": "ClusterFirstWithHostNet"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
