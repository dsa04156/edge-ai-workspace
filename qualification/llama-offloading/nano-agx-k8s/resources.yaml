                "command": [
                  "python",
                  "-c",
                  "from pathlib import Path; p=Path(\"/models/.storage-uuid\"); expected=\"c6889d5e-37bb-4b07-8e0b-757d3de8c877\"; actual=p.read_text().strip(); assert actual == expected, \"SD cache identity mismatch\"; print(\"SD cache identity verified\")"
