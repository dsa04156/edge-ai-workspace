apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llama-continuity-test
resources: [resources.yaml, sd-storage.yaml]
configMapGenerator:
  - name: continuity-worker-code
    files: [../worker.py]
  - name: continuity-code
    files:
      - ../continuity_policy.py
      - ../continuity_runner.py
      - ../continuity_report.py
