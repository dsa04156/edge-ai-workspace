apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llama-offload-eval
resources:
  - k8s/namespace.yaml
  - k8s/workers.yaml
  - k8s/proxy.yaml
  - k8s/model-cache.yaml
patches:
  - path: k8s/cache-patch.yaml
configMapGenerator:
  - name: llama-worker-code
    files:
      - worker.py
  - name: llama-proxy-code
    files:
      - proxy.py
      - placement.py
