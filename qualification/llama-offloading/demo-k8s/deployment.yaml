apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-demo-records
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: llama-demo}
  template:
    metadata:
      labels: {app: llama-demo}
    spec:
      nodeSelector: {kubernetes.io/hostname: etri-ser0001-cg0msb}
      serviceAccountName: llama-demo
      automountServiceAccountToken: true
      securityContext: {fsGroup: 65532}
      containers:
        - name: demo
          image: docker.io/library/python@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
          command: [python, /app/demo.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: DEMO_GPU_AUTOMATION, value: "1"}
          ports: [{name: http, containerPort: 18102}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 512Mi}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: web, mountPath: /app/demo-web, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: code
          configMap: {name: llama-demo-code}
        - name: web
          configMap: {name: llama-demo-web}
        - name: data
          persistentVolumeClaim: {claimName: llama-demo-records}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-demo
spec:
  selector: {app: llama-demo}
  ports: [{name: http, port: 18102, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llama-demo
spec:
  ingressClassName: traefik
  rules:
    - host: llama-demo.192.168.0.56.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llama-demo
                port: {number: 18102}
