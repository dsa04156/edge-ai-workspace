apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-worker-nano
  labels:
    app.kubernetes.io/name: llama-worker
    app.kubernetes.io/part-of: llama-offload-prototype
    edge-ai.io/qualification-role: nano
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-worker
      edge-ai.io/qualification-role: nano
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-worker
        app.kubernetes.io/part-of: llama-offload-prototype
        edge-ai.io/qualification-role: nano
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      shareProcessNamespace: true
      nodeSelector: {kubernetes.io/hostname: etri-dev0001-jetorn}
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: inference-runtime
          image: docker.io/ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
          imagePullPolicy: IfNotPresent
          command: [/bin/ollama]
          args: [serve]
          env:
            - {name: OLLAMA_HOST, value: "127.0.0.1:11435"}
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
            - {name: OLLAMA_MAX_LOADED_MODELS, value: "1"}
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}
            - {name: OLLAMA_KV_CACHE_TYPE, value: q8_0}
            - {name: JETSON_JETPACK, value: "6"}
            - {name: NVIDIA_VISIBLE_DEVICES, value: "all"}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
            - {name: LD_LIBRARY_PATH, value: "/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/tegra:/usr/lib/ollama/cuda_jetpack6"}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 5Gi}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: jetson-nvidia-libs, mountPath: /usr/lib/aarch64-linux-gnu/nvidia, readOnly: true}
            - {name: jetson-tegra-libs, mountPath: /usr/lib/aarch64-linux-gnu/tegra, readOnly: true}
        - name: api
          image: docker.io/library/python@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
          imagePullPolicy: IfNotPresent
          command: [python, /app/worker.py]
          env:
            - {name: NODE_ID, value: etri-dev0001-jetorn}
            - {name: ROLE, value: nano}
            - {name: MODEL, value: "llama3.2:1b"}
            - {name: OLLAMA_URL, value: "http://127.0.0.1:11435"}
            - {name: PORT, value: "18100"}
            - {name: MAX_CONCURRENCY, value: "1"}
            - {name: PROFILE_INFERENCE_MS, value: "194"}
          ports: [{name: http, containerPort: 18100, hostPort: 18100}]
          startupProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: worker-code, mountPath: /app, readOnly: true}
      volumes:
        - name: worker-code
          configMap: {name: llama-worker-code}
        - name: jetson-nvidia-libs
          hostPath: {path: /usr/lib/aarch64-linux-gnu/nvidia, type: Directory}
        - name: jetson-tegra-libs
          hostPath: {path: /usr/lib/aarch64-linux-gnu/tegra, type: Directory}
---
