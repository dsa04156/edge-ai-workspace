apiVersion: v1
kind: Namespace
metadata:
  name: llama-boundaries-eval
  labels:
    purpose: isolated-llm-qualification
---
apiVersion: v1
kind: Pod
metadata:
  name: runtime-probe-5060
  namespace: llama-boundaries-eval
  labels:
    purpose: isolated-llm-qualification
spec:
  activeDeadlineSeconds: 600
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: etri-ser0001-cg0msb
  containers:
    - name: runtime
      image: docker.io/ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
      command: ["/bin/sh", "-c"]
      args: ["/bin/ollama --version; /usr/lib/ollama/llama-server --version"]
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
