# Merge patch; do not apply as a standalone resource.
# Keeps the admission controller off intermittently disconnected edge nodes.
# kubectl --context=kubernetes-admin@kubernetes -n kueue-system patch deployment \
#   kueue-controller-manager --type=merge --patch-file=kubeedge-tools/config/kueue-controller-placement-patch.yaml
spec:
  template:
    spec:
      nodeSelector: null
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [etri-ser0001-cg0msb, etri-ser0002-cgnmsb]
