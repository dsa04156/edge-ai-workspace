apiVersion: v1
kind: ServiceAccount
metadata:
  name: mqttvirtual-mapper
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mqttvirtual-mapper-device-status
  namespace: default
rules:
  - apiGroups: ["devices.kubeedge.io"]
    resources: ["devices/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mqttvirtual-mapper-device-status
  namespace: default
subjects:
  - kind: ServiceAccount
    name: mqttvirtual-mapper
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mqttvirtual-mapper-device-status
