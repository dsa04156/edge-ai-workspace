apiVersion: v1
kind: Pod
metadata:
  name: curl-debug
  namespace: telemetry
spec:
  nodeSelector:
    kubernetes.io/hostname: etri-dev0003-raspi5
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"