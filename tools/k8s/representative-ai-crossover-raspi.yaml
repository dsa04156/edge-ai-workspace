apiVersion: batch/v1
kind: Job
metadata:
  name: representative-ai-crossover-raspi-20260818
  namespace: edgex-edge
  labels:
    edge-ai.io/representative-benchmark: "true"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: representative-ai-crossover
        edge-ai.io/representative-benchmark: "true"
    spec:
      nodeSelector:
        kubernetes.io/hostname: etri-dev0003-raspi5
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-server1
          image: 192.168.0.56:5000/representative-ai-crossover@sha256:bde0ae4958c306c26a22546cc86774469c4cbacb143bfc436955e683f6650dd2
          command:
            - python
            - -c
            - |
              import time, urllib.request
              for attempt in range(120):
                  try:
                      with urllib.request.urlopen("http://representative-ai-server1:8080/healthz", timeout=2) as response:
                          if response.status == 200:
                              raise SystemExit(0)
                  except Exception:
                      time.sleep(1)
              raise SystemExit("representative Server1 did not become ready")
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: benchmark
          image: 192.168.0.56:5000/representative-ai-crossover@sha256:bde0ae4958c306c26a22546cc86774469c4cbacb143bfc436955e683f6650dd2
          command:
            - python
            - /benchmark/representative_ai_crossover_experiment.py
            - run
          args:
            - --replay-input
            - /dataset/jetson.json
            - --widths
            - 16384,65536
            - --depth
            - "20"
            - --cpu-ratios
            - 0,0.5,0.75,1
            - --repetitions
            - "3"
            - --requests-per-run
            - "10"
            - --washout-seconds
            - "0.2"
            - --output
            - /tmp/representative-ai-crossover-raspi.json
          env:
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: EXECUTION_SITE
              value: raspberry-pi-dev0003
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: benchmark
              mountPath: /benchmark
              readOnly: true
            - name: dataset
              mountPath: /dataset
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: benchmark
          configMap:
            name: representative-ai-crossover
        - name: dataset
          configMap:
            name: representative-ai-crossover-dataset
        - name: tmp
          emptyDir: {}
